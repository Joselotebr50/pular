<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<title>Neon Runner — Synthwave</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;background:#05010f;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    position:fixed;inset:0;
    touch-action:none;user-select:none;
    -webkit-user-select:none;-webkit-tap-highlight-color:transparent;
  }
  #jogo{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
</style>
</head>
<body>
<canvas id="jogo"></canvas>

<script>
(() => {
'use strict';

/* ══════════ CONFIG ══════════ */
const BASE_W = 780, BASE_H = 380;
const BASE_GRAVIDADE = 0.9, BASE_FORCA_PULO = -16.5;
const BASE_VEL_INICIAL = 6, BASE_VEL_MAXIMA = 17;
const BASE_CHAO_ALTURA = 70;
const FASE_DURACAO=22, FASE_INTRO=2.5, FASE_OUTRO=2.2;
const DASH_DUR=0.35, DASH_CD=1.6;
const INVULN_TEMPO=1.8, VIDA_MAX=3;
const TRANSICAO_DUR = 4.0;

let LARGURA=780, ALTURA=380, CHAO_Y=310, ESCALA=1;
let GRAVIDADE=BASE_GRAVIDADE, FORCA_PULO=BASE_FORCA_PULO;
let VEL_INICIAL=BASE_VEL_INICIAL, VEL_MAXIMA=BASE_VEL_MAXIMA;

const canvas = document.getElementById('jogo');
const ctx = canvas.getContext('2d');
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ══════════ FASES — cada uma tem um tom neon ══════════ */
const FASES = [
  { nome:'NEON CITY',     h1:300, h2:180, obstaculos:['pneu','macaco','caixa'] },
  { nome:'SUNSET DRIVE',  h1:15,  h2:320, obstaculos:['bigorna','engrenagem','barra'] },
  { nome:'MATRIX YARD',   h1:140, h2:80,  obstaculos:['engradado','lata','balde'] },
  { nome:'VAPORWAVE',     h1:280, h2:200, obstaculos:['portaCarro','extintor','lataTinta'] },
  { nome:'ICE CIRCUIT',   h1:200, h2:160, obstaculos:['tabua','serra','martelo'] },
  { nome:'CYBER LAB',     h1:160, h2:280, obstaculos:['capacitor','chip','bobina'] }
];

const TIPOS_OBSTACULO = {
  pneu:{largura:46,altura:46},macaco:{largura:42,altura:60},caixa:{largura:54,altura:42},
  bigorna:{largura:66,altura:52},engrenagem:{largura:56,altura:56},barra:{largura:28,altura:72},
  engradado:{largura:52,altura:52},lata:{largura:38,altura:56},balde:{largura:46,altura:48},
  portaCarro:{largura:62,altura:46},extintor:{largura:32,altura:64},lataTinta:{largura:42,altura:54},
  tabua:{largura:72,altura:24},serra:{largura:58,altura:46},martelo:{largura:48,altura:56},
  capacitor:{largura:36,altura:58},chip:{largura:54,altura:42},bobina:{largura:46,altura:52},
  projetilBoss:{largura:44,altura:44}
};

const SKINS = [
  {nome:'CIANO',   c1:'#00f5ff', c2:'#0090ff', preco:0},
  {nome:'MAGENTA', c1:'#ff2ec4', c2:'#a800ff', preco:300},
  {nome:'LIMÃO',   c1:'#b4ff00', c2:'#00ff80', preco:600},
  {nome:'OURO',    c1:'#ffcc00', c2:'#ff6600', preco:1200},
  {nome:'FANTASMA',c1:'#e0e0ff', c2:'#a5b4fc', preco:2500}
];

/* ══════════ UTILS ══════════ */
const rand=(a,b)=>Math.random()*(b-a)+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hsla(h,s,l,a=1){return `hsla(${h},${s}%,${l}%,${a})`;}
function arredondado(x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function colide(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}
function getSafeInsets(){
  try{
    const st=getComputedStyle(document.documentElement);
    const p=v=>{const n=parseFloat(v);return isFinite(n)&&n>0?n:0;};
    return {top:p(st.getPropertyValue('--sat')),right:p(st.getPropertyValue('--sar')),
            bottom:p(st.getPropertyValue('--sab')),left:p(st.getPropertyValue('--sal'))};
  }catch(e){return{top:0,right:0,bottom:0,left:0};}
}

/* ══════════ SAVE ══════════ */
let recorde=0, moedasTotais=0, skinsDesbloq=[0], skinAtual=0;
try{
  recorde=parseInt(localStorage.getItem('nr.recorde'),10)||0;
  moedasTotais=parseInt(localStorage.getItem('nr.moedas'),10)||0;
  const sd=localStorage.getItem('nr.skins'); if(sd) skinsDesbloq=JSON.parse(sd);
  skinAtual=parseInt(localStorage.getItem('nr.skin'),10)||0;
  if(!skinsDesbloq.includes(skinAtual)) skinAtual=0;
}catch(e){}
function salvar(){
  try{
    localStorage.setItem('nr.recorde',recorde);
    localStorage.setItem('nr.moedas',moedasTotais);
    localStorage.setItem('nr.skins',JSON.stringify(skinsDesbloq));
    localStorage.setItem('nr.skin',skinAtual);
  }catch(e){}
}

/* ══════════ CANVAS ══════════ */
function redimensionar(){
  const w=(window.visualViewport&&window.visualViewport.width)||window.innerWidth||780;
  const h=(window.visualViewport&&window.visualViewport.height)||window.innerHeight||380;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.floor(w*dpr));
  canvas.height=Math.max(1,Math.floor(h*dpr));
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  LARGURA=w; ALTURA=h;
  ESCALA=Math.min(LARGURA/BASE_W, ALTURA/BASE_H);
  CHAO_Y=ALTURA*0.68;
  GRAVIDADE=BASE_GRAVIDADE*ESCALA;
  FORCA_PULO=BASE_FORCA_PULO*ESCALA;
  VEL_INICIAL=BASE_VEL_INICIAL*ESCALA;
  VEL_MAXIMA=BASE_VEL_MAXIMA*ESCALA;
  calcularBotoes();
  gerarEstrelas();
}
window.addEventListener('resize',redimensionar);
window.addEventListener('orientationchange',()=>setTimeout(redimensionar,150));
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',redimensionar);
  window.visualViewport.addEventListener('scroll',redimensionar);
}

/* ══════════ ÁUDIO ══════════ */
let audioCtx=null;
function initAudio(){
  if(audioCtx) return;
  try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
}
function beep(f,d,t='square',v=0.05){
  if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=t; o.frequency.value=f; g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function sweep(f1,f2,d,t='sawtooth',v=0.06){
  if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=t;
    o.frequency.setValueAtTime(f1,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2,audioCtx.currentTime+d);
    g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
const SFX={
  pulo:()=>sweep(420,720,0.15),pulo2:()=>sweep(520,880,0.15),
  moeda:()=>{beep(1400,0.08,'square',0.05);setTimeout(()=>beep(1800,0.08,'square',0.05),50);},
  dano:()=>sweep(280,90,0.3,'sawtooth',0.1),
  power:()=>{beep(700,0.1,'triangle',0.08);setTimeout(()=>beep(1100,0.15,'triangle',0.08),80);},
  dash:()=>sweep(600,1400,0.15,'sine',0.06),
  morte:()=>sweep(400,80,0.6,'sawtooth',0.1),
  fase:()=>{beep(700,0.15,'triangle',0.08);setTimeout(()=>beep(1050,0.15,'triangle',0.08),120);setTimeout(()=>beep(1400,0.25,'triangle',0.08),240);},
  boss:()=>{sweep(200,90,0.5,'sawtooth',0.1);setTimeout(()=>sweep(180,70,0.6,'sawtooth',0.1),250);}
};

/* ══════════ ESTADO ══════════ */
const estado={
  tela:'menu',faseIdx:0,ciclo:0,faseTempo:0,
  aviso:0,concluindo:0,velocidade:VEL_INICIAL,
  distancia:0,pontos:0,tempoFim:0,frame:0,
  deslocChao:0,deslocGrade:0,shake:0,
  powerUps:{escudo:0,ima:0,lento:0,inv:0,super:0},
  proxPowerUp:6,proxMoeda:4,proxDrone:8,
  estrelas:0,moedasRun:0,combo:0,comboTempo:0
};
const jogador={
  x:0,largura:38,alturaBase:46,alturaAgachado:26,alturaAtual:46,
  y:0,vy:0,saltos:0,maxSaltosBase:2,noChao:true,agachando:false,
  dashTempo:0,dashCd:0,invuln:0,vidas:VIDA_MAX,rastro:[]
};
let obstaculos=[],powerUps=[],moedas=[],particulas=[],drones=[];
let proximoObstaculo=450;
const boss={ativo:false,hp:8,maxHp:8,cooldown:2,entrada:0,hitFlash:0};

/* Estrelas geradas uma vez */
let estrelas=[];
function gerarEstrelas(){
  estrelas=[];
  const n=Math.floor(LARGURA*ALTURA/9000);
  for(let i=0;i<n;i++){
    estrelas.push({
      x:Math.random()*LARGURA,
      y:Math.random()*(CHAO_Y*0.7),
      tam:Math.random()<0.85?0.8:1.6,
      fase:Math.random()*Math.PI*2,
      vel:0.5+Math.random()*1.5
    });
  }
}

/* ══════════ BOTÕES VIRTUAIS ══════════ */
const botoes={
  pulo:{x:0,y:0,r:0,ativo:false,tipo:'pulo',cor:'#00f5ff'},
  dash:{x:0,y:0,r:0,ativo:false,tipo:'dash',cor:'#ff2ec4'},
  agacha:{x:0,y:0,r:0,ativo:false,tipo:'agacha',cor:'#b4ff00'}
};
let botoesAlpha=0.18, botoesVisivel=0;
function calcularBotoes(){
  if(!isTouch) return;
  const safe=getSafeInsets();
  const minDim=Math.min(LARGURA,ALTURA);
  const r=Math.max(24,minDim*0.048);
  const m=14+r, gap=r*2+10;
  botoes.pulo.r=r; botoes.dash.r=r*0.9; botoes.agacha.r=r*0.9;
  botoes.pulo.x=LARGURA-m-safe.right;
  botoes.pulo.y=ALTURA-m-safe.bottom;
  botoes.dash.x=botoes.pulo.x-gap;
  botoes.dash.y=botoes.pulo.y;
  botoes.agacha.x=m+safe.left;
  botoes.agacha.y=ALTURA-m-safe.bottom;
}
function acordarBotoes(){botoesVisivel=2.2;}
function atualizarBotoes(dt){
  if(botoesVisivel>0) botoesVisivel=Math.max(0,botoesVisivel-dt/60);
  const a=botoes.pulo.ativo||botoes.dash.ativo||botoes.agacha.ativo;
  const alvo=(botoesVisivel>0||a)?0.95:0.18;
  botoesAlpha+=(alvo-botoesAlpha)*Math.min(1,0.14*dt);
}
function pontoEmBotao(x,y){
  for(const k of ['pulo','dash','agacha']){
    const b=botoes[k],dx=x-b.x,dy=y-b.y;
    if(dx*dx+dy*dy<=b.r*b.r) return b;
  }
  return null;
}

/* ══════════ PARTÍCULAS ══════════ */
function addP(x,y,cor,vx,vy,vida,tam){
  particulas.push({x,y,cor,vx,vy,vida,vidaMax:vida,tam:(tam||3)*ESCALA});
}

/* ══════════ FASE ══════════ */
const isBossPhase=()=>estado.faseIdx>=FASES.length;
const faseAtual=()=>FASES[estado.faseIdx%FASES.length];

function resetJogador(){
  jogador.x=110*ESCALA;
  jogador.largura=38*ESCALA;
  jogador.alturaBase=46*ESCALA;
  jogador.alturaAgachado=26*ESCALA;
  jogador.alturaAtual=jogador.alturaBase;
  jogador.y=CHAO_Y; jogador.vy=0; jogador.saltos=0; jogador.noChao=true;
  jogador.agachando=false; jogador.dashTempo=0; jogador.dashCd=0;
  jogador.invuln=0; jogador.rastro=[];
}
function iniciarFase(idx){
  estado.faseIdx=idx; estado.faseTempo=0;
  estado.aviso=FASE_INTRO; estado.concluindo=0;
  obstaculos=[]; powerUps=[]; moedas=[]; drones=[];
  proximoObstaculo=450*ESCALA;
  estado.proxPowerUp=rand(6,12);
  estado.proxMoeda=rand(3,6);
  estado.proxDrone=rand(6,12);
  estado.moedasRun=0; estado.combo=0;
  if(idx>=FASES.length){
    boss.ativo=true; boss.hp=boss.maxHp; boss.cooldown=2.5; boss.entrada=0; boss.hitFlash=0;
    SFX.boss();
  } else {
    boss.ativo=false;
    SFX.fase();
  }
}
function iniciarJogo(){
  estado.tela='jogando';
  estado.ciclo=0; estado.distancia=0; estado.pontos=0;
  estado.tempoFim=0; estado.velocidade=VEL_INICIAL;
  estado.powerUps={escudo:0,ima:0,lento:0,inv:0,super:0};
  jogador.vidas=VIDA_MAX;
  resetJogador(); particulas=[];
  iniciarFase(0); salvar();
}

/* ══════════ AÇÕES ══════════ */
function pular(){
  if(estado.tela==='menu'){initAudio();iniciarJogo();return;}
  if(estado.tela==='fim'){if(estado.tempoFim>30){initAudio();iniciarJogo();}return;}
  const maxS=jogador.maxSaltosBase+(estado.powerUps.super>0?1:0);
  if(jogador.saltos<maxS){
    jogador.vy=jogador.saltos===0?FORCA_PULO:FORCA_PULO*.85;
    jogador.saltos++; jogador.noChao=false;
    jogador.saltos===1?SFX.pulo():SFX.pulo2();
    for(let i=0;i<6;i++){
      addP(jogador.x+jogador.largura/2,jogador.y,'#ffffff',
        rand(-2,2)*ESCALA,rand(-1,0.5)*ESCALA,0.4,rand(1.5,3));
    }
  }
}
function agachar(a){if(estado.tela==='jogando') jogador.agachando=a;}
function dash(){
  if(estado.tela!=='jogando') return;
  if(jogador.dashCd>0||!jogador.noChao) return;
  jogador.dashTempo=DASH_DUR; jogador.dashCd=DASH_CD;
  jogador.invuln=Math.max(jogador.invuln,DASH_DUR);
  SFX.dash();
  for(let i=0;i<12;i++){
    addP(jogador.x,jogador.y-jogador.alturaAtual/2,'#00f5ff',
      rand(-8,-3)*ESCALA,rand(-2,2)*ESCALA,0.4,rand(1.5,3.5));
  }
}

/* ══════════ SPAWN ══════════ */
function criarObstaculo(){
  const fase=faseAtual();
  const nome=fase.obstaculos[Math.floor(Math.random()*fase.obstaculos.length)];
  const def=TIPOS_OBSTACULO[nome];
  const movel=Math.random()<0.2 && estado.faseTempo>6;
  const w=def.largura*ESCALA,h=def.altura*ESCALA;
  obstaculos.push({
    x:LARGURA+40*ESCALA,y:CHAO_Y-h,baseY:CHAO_Y-h,
    largura:w,altura:h,tipo:nome,movel,movBob:rand(0,6.28),
    movAmp:movel?rand(8,18)*ESCALA:0
  });
}
function criarMoeda(){
  moedas.push({x:LARGURA+40*ESCALA,y:CHAO_Y-rand(60,150)*ESCALA,
    largura:22*ESCALA,altura:22*ESCALA,bob:rand(0,6.28),rot:0});
}
function criarPowerUp(){
  const tipos=['escudo','ima','lento','inv','super'];
  const t=tipos[Math.floor(Math.random()*tipos.length)];
  powerUps.push({x:LARGURA+40*ESCALA,y:CHAO_Y-rand(90,140)*ESCALA,
    largura:40*ESCALA,altura:40*ESCALA,tipo:t,bob:rand(0,6.28)});
}
function criarDrone(){
  const hs=[35,95,130];
  const hAlt=hs[Math.floor(Math.random()*hs.length)]*ESCALA;
  drones.push({x:LARGURA+40*ESCALA,y:CHAO_Y-hAlt,baseY:CHAO_Y-hAlt,
    largura:52*ESCALA,altura:26*ESCALA,bob:rand(0,6.28),helic:0});
}
function criarProjetilBoss(){
  obstaculos.push({x:LARGURA-260*ESCALA,y:CHAO_Y-90*ESCALA,baseY:CHAO_Y-90*ESCALA,
    largura:44*ESCALA,altura:44*ESCALA,tipo:'projetilBoss',
    contado:false,rotacao:0,vy:0,movel:false});
}

/* ══════════ DANO / FIM ══════════ */
function perderVida(){
  if(jogador.invuln>0) return;
  jogador.vidas--; jogador.invuln=INVULN_TEMPO;
  estado.shake=14*ESCALA; SFX.dano();
  for(let i=0;i<20;i++){
    addP(jogador.x+jogador.largura/2,jogador.y-jogador.alturaAtual/2,
      i%2?'#ff2ec4':'#ffaa00',rand(-5,5)*ESCALA,rand(-6,1)*ESCALA,0.7,rand(2,5));
  }
  if(jogador.vidas<=0) finalizarJogo();
}
function finalizarJogo(){
  estado.tela='fim'; estado.tempoFim=0;
  if(estado.pontos>recorde){recorde=estado.pontos;salvar();}
  moedasTotais+=estado.moedasRun; salvar(); SFX.morte();
}

/* ══════════ UPDATE ══════════ */
function atualizar(dt){
  estado.frame+=dt;

  let velFundo;
  if(estado.tela==='jogando'&&!estado.aviso&&!estado.concluindo) velFundo=estado.velocidade;
  else if(estado.tela==='jogando') velFundo=4*ESCALA;
  else velFundo=2.5*ESCALA;

  const fatorLento=estado.powerUps.lento>0?0.55:1;

  estado.deslocChao=(estado.deslocChao+velFundo*dt)%(80*ESCALA);
  estado.deslocGrade=(estado.deslocGrade+velFundo*0.9*dt)%(60*ESCALA);

  /* estrelas piscam */
  for(const s of estrelas) s.fase+=dt*0.05*s.vel;

  for(let i=particulas.length-1;i>=0;i--){
    const p=particulas[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.25*ESCALA*dt;
    p.vida-=dt/60;
    if(p.vida<=0) particulas.splice(i,1);
  }

  if(estado.shake>0) estado.shake=Math.max(0,estado.shake-dt*0.6*ESCALA);
  if(jogador.dashCd>0) jogador.dashCd-=dt/60;
  if(jogador.dashTempo>0) jogador.dashTempo-=dt/60;
  if(jogador.invuln>0) jogador.invuln-=dt/60;

  const alvoAlt=jogador.agachando&&jogador.noChao?jogador.alturaAgachado:jogador.alturaBase;
  jogador.alturaAtual+=(alvoAlt-jogador.alturaAtual)*0.3*dt;

  jogador.vy+=GRAVIDADE*dt;
  jogador.y+=jogador.vy*dt;
  if(jogador.y>=CHAO_Y){
    jogador.y=CHAO_Y; jogador.vy=0; jogador.saltos=0; jogador.noChao=true;
  } else jogador.noChao=false;

  if(estado.tela==='jogando'&&!estado.aviso&&!estado.concluindo){
    jogador.rastro.push({x:jogador.x+jogador.largura/2,y:jogador.y-jogador.alturaAtual/2,vida:0.4});
    if(jogador.rastro.length>14) jogador.rastro.shift();
  }
  for(let i=jogador.rastro.length-1;i>=0;i--){
    jogador.rastro[i].vida-=dt/60;
    if(jogador.rastro[i].vida<=0) jogador.rastro.splice(i,1);
  }

  atualizarBotoes(dt);

  if(estado.tela==='fim'){estado.tempoFim+=dt;return;}
  if(estado.tela!=='jogando') return;

  for(const k in estado.powerUps){
    if(estado.powerUps[k]>0) estado.powerUps[k]=Math.max(0,estado.powerUps[k]-dt/60);
  }
  if(estado.comboTempo>0){
    estado.comboTempo-=dt/60;
    if(estado.comboTempo<=0) estado.combo=0;
  }

  if(estado.aviso>0){
    estado.aviso-=dt/60;
    if(boss.ativo) boss.entrada=Math.min(1,boss.entrada+dt/60/FASE_INTRO);
    return;
  }
  if(estado.concluindo>0){
    estado.concluindo-=dt/60;
    if(estado.concluindo<=0){
      let prox=estado.faseIdx+1;
      if(prox>FASES.length){prox=0;estado.ciclo++;}
      iniciarFase(prox);
    }
    return;
  }

  const velBase=VEL_INICIAL*(1+estado.faseIdx*0.2+estado.ciclo*0.4);
  estado.velocidade=Math.min(VEL_MAXIMA,velBase+estado.faseTempo*0.10*ESCALA);
  const velEfetiva=estado.velocidade*fatorLento;

  estado.distancia+=velEfetiva*dt;
  const mult=(estado.powerUps.ima>0?2:1)*(1+estado.combo*0.5);
  estado.pontos=Math.floor(estado.distancia/(20*ESCALA))*mult;

  if(boss.ativo){
    boss.entrada=Math.min(1,boss.entrada+dt/60/1.5);
    if(boss.hitFlash>0) boss.hitFlash-=dt/60;
    boss.cooldown-=dt/60;
    if(boss.cooldown<=0){criarProjetilBoss();boss.cooldown=rand(1.4,1.9);}
  } else {
    estado.faseTempo+=dt/60;
    if(estado.faseTempo>=FASE_DURACAO){
      estado.concluindo=FASE_OUTRO;
      estado.estrelas=jogador.vidas>=3?3:jogador.vidas>=2?2:1;
      obstaculos=[]; return;
    }
  }

  proximoObstaculo-=velEfetiva*dt;
  if(proximoObstaculo<=0){
    criarObstaculo();
    proximoObstaculo=rand(250,430)*ESCALA*(estado.velocidade/VEL_INICIAL);
  }
  estado.proxMoeda-=dt/60;
  if(estado.proxMoeda<=0){criarMoeda();estado.proxMoeda=rand(2.5,5);}
  estado.proxPowerUp-=dt/60;
  if(estado.proxPowerUp<=0){criarPowerUp();estado.proxPowerUp=rand(9,16);}
  if(estado.faseIdx>=1){
    estado.proxDrone-=dt/60;
    if(estado.proxDrone<=0){criarDrone();estado.proxDrone=rand(5,10);}
  }

  for(const o of obstaculos){
    o.x-=velEfetiva*dt*(o.tipo==='projetilBoss'?1.15:1);
    if(o.movel){o.movBob+=dt*0.05;o.y=o.baseY+Math.sin(o.movBob)*o.movAmp;}
    if(o.tipo==='projetilBoss'){
      o.rotacao+=0.15*dt;
      if(o.y+o.altura<CHAO_Y) o.vy+=GRAVIDADE*0.25*dt;
      o.y+=o.vy*dt;
      if(o.y+o.altura>CHAO_Y){o.y=CHAO_Y-o.altura;o.vy=0;}
    }
  }
  obstaculos=obstaculos.filter(o=>o.x+o.largura>-60*ESCALA);

  for(const o of obstaculos){
    if(o.tipo==='projetilBoss'&&!o.contado&&o.x+o.largura<jogador.x){
      o.contado=true; boss.hp--; boss.hitFlash=0.3; estado.shake=8*ESCALA;
      for(let i=0;i<10;i++){
        addP(o.x+o.largura/2,o.y+o.altura/2,'#ffcc00',
          rand(-4,4)*ESCALA,rand(-4,4)*ESCALA,0.5,rand(2,4));
      }
    }
  }
  if(boss.ativo&&boss.hp<=0){
    estado.concluindo=FASE_OUTRO; estado.estrelas=3;
    obstaculos=[]; boss.ativo=false; estado.shake=18*ESCALA; SFX.fase();
    return;
  }

  for(const m of moedas){m.x-=velEfetiva*dt;m.bob+=dt*0.1;m.rot+=dt*0.1;}
  moedas=moedas.filter(m=>m.x+m.largura>-40*ESCALA);
  for(const p of powerUps){p.x-=velEfetiva*dt;p.bob+=dt*0.1;}
  powerUps=powerUps.filter(p=>p.x+p.largura>-40*ESCALA);
  for(const d of drones){
    d.x-=velEfetiva*dt*1.05; d.bob+=dt*0.08; d.helic+=dt*0.5;
    d.y=d.baseY+Math.sin(d.bob)*6*ESCALA;
  }
  drones=drones.filter(d=>d.x+d.largura>-40*ESCALA);

  const hb={
    x:jogador.x+6*ESCALA,
    y:jogador.y-jogador.alturaAtual+5*ESCALA,
    w:jogador.largura-12*ESCALA,
    h:jogador.alturaAtual-8*ESCALA
  };

  for(let i=moedas.length-1;i>=0;i--){
    const m=moedas[i];
    const hm={x:m.x+3*ESCALA,y:m.y+3*ESCALA,w:m.largura-6*ESCALA,h:m.altura-6*ESCALA};
    if(colide(hb,hm)){
      estado.pontos+=10; estado.moedasRun++; moedas.splice(i,1); SFX.moeda();
      for(let k=0;k<8;k++){
        addP(m.x+m.largura/2,m.y+m.altura/2,'#ffdd44',
          rand(-3,3)*ESCALA,rand(-3,1)*ESCALA,0.5,rand(1.5,3));
      }
    }
  }
  for(let i=powerUps.length-1;i>=0;i--){
    const p=powerUps[i];
    const hp={x:p.x+4*ESCALA,y:p.y+4*ESCALA,w:p.largura-8*ESCALA,h:p.altura-8*ESCALA};
    if(colide(hb,hp)){
      const dur={escudo:5,ima:8,lento:5,inv:5,super:8}[p.tipo];
      estado.powerUps[p.tipo]=dur; powerUps.splice(i,1); SFX.power();
      for(let k=0;k<15;k++){
        addP(p.x+p.largura/2,p.y+p.altura/2,'#a855f7',
          rand(-5,5)*ESCALA,rand(-5,5)*ESCALA,0.7,rand(1.5,4));
      }
    }
  }

  const invulnAll=estado.powerUps.inv>0;
  const escudoAtivo=estado.powerUps.escudo>0||jogador.dashTempo>0||jogador.invuln>0;

  for(let i=obstaculos.length-1;i>=0;i--){
    const o=obstaculos[i];
    const ho={x:o.x+4*ESCALA,y:o.y+4*ESCALA,w:o.largura-8*ESCALA,h:o.altura-4*ESCALA};
    if(colide(hb,ho)){
      if(invulnAll){obstaculos.splice(i,1);continue;}
      if(escudoAtivo){
        obstaculos.splice(i,1);
        for(let k=0;k<12;k++) addP(o.x+o.largura/2,o.y+o.altura/2,'#00f5ff',
          rand(-5,5)*ESCALA,rand(-5,2)*ESCALA,0.5,rand(2,5));
        continue;
      }
      perderVida();
      if(estado.tela==='fim') return;
      obstaculos.splice(i,1); break;
    }
  }
  for(let i=drones.length-1;i>=0;i--){
    const d=drones[i];
    const hd={x:d.x+5*ESCALA,y:d.y+4*ESCALA,w:d.largura-10*ESCALA,h:d.altura-8*ESCALA};
    if(colide(hb,hd)){
      if(invulnAll){drones.splice(i,1);continue;}
      if(escudoAtivo){
        drones.splice(i,1);
        for(let k=0;k<12;k++) addP(d.x+d.largura/2,d.y+d.altura/2,'#ff2ec4',
          rand(-5,5)*ESCALA,rand(-5,2)*ESCALA,0.5,rand(2,5));
        continue;
      }
      perderVida();
      if(estado.tela==='fim') return;
      drones.splice(i,1); break;
    }
  }
}

/* ══════════ CORES ATUAIS (com transição) ══════════ */
function fatorTransicao(){
  if(estado.tela!=='jogando') return 0;
  if(isBossPhase()) return 0;
  if(estado.faseIdx+1>=FASES.length) return 0;
  const inicio=FASE_DURACAO-TRANSICAO_DUR;
  return clamp((estado.faseTempo-inicio)/TRANSICAO_DUR,0,1);
}
function corAtual(){
  const t=fatorTransicao();
  const a=FASES[estado.faseIdx%FASES.length];
  const b=FASES[(estado.faseIdx+1)%FASES.length];
  const lerp=(x,y)=>x+(y-x)*t;
  return {
    h1: lerp(a.h1,b.h1),
    h2: lerp(a.h2,b.h2)
  };
}

/* ══════════ DESENHO — SYNTHWAVE BACKGROUND ══════════ */
function desenharFundoSynth(){
  const c=corAtual();

  /* Céu — gradiente escuro para a cor da fase */
  const g=ctx.createLinearGradient(0,0,0,CHAO_Y);
  g.addColorStop(0,   '#05010f');
  g.addColorStop(0.4, hsla(c.h1,70,8));
  g.addColorStop(0.75,hsla(c.h1,80,18));
  g.addColorStop(1,   hsla(c.h2,85,30));
  ctx.fillStyle=g;
  ctx.fillRect(0,0,LARGURA,CHAO_Y);

  /* Estrelas */
  for(const s of estrelas){
    const piscar=0.5+0.5*Math.sin(s.fase);
    ctx.fillStyle=`rgba(255,255,255,${piscar*0.9})`;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.tam,0,Math.PI*2);
    ctx.fill();
  }

  /* Sol gigante com listras horizontais */
  const sunX=LARGURA*0.5;
  const sunY=CHAO_Y*0.62;
  const sunR=Math.min(LARGURA,CHAO_Y)*0.32;
  if(sunR>0){
    const gS=ctx.createLinearGradient(sunX,sunY-sunR,sunX,sunY+sunR);
    gS.addColorStop(0,hsla(c.h2,100,70));
    gS.addColorStop(0.5,hsla(c.h1,100,60));
    gS.addColorStop(1,hsla(c.h1,100,45));

    ctx.save();
    ctx.beginPath();
    ctx.arc(sunX,sunY,sunR,0,Math.PI*2);
    ctx.clip();
    ctx.fillStyle=gS;
    ctx.fillRect(sunX-sunR,sunY-sunR,sunR*2,sunR*2);

    /* Glow */
    ctx.globalCompositeOperation='lighter';
    const gGlow=ctx.createRadialGradient(sunX,sunY,sunR*0.5,sunX,sunY,sunR*1.8);
    gGlow.addColorStop(0,hsla(c.h1,100,60,0.35));
    gGlow.addColorStop(1,hsla(c.h1,100,60,0));
    ctx.fillStyle=gGlow;
    ctx.fillRect(0,0,LARGURA,CHAO_Y);
    ctx.restore();

    /* Listras horizontais cortando o sol */
    ctx.save();
    ctx.beginPath();
    ctx.arc(sunX,sunY,sunR,0,Math.PI*2);
    ctx.clip();
    ctx.fillStyle='#05010f';
    const passo=sunR*0.12;
    for(let y=sunY+sunR*0.1;y<sunY+sunR;y+=passo){
      const h=passo*0.45*(0.3+(y-sunY)/sunR);
      ctx.fillRect(sunX-sunR,y,sunR*2,h);
    }
    ctx.restore();
  }

  /* Montanhas distantes (silhueta) */
  ctx.fillStyle=hsla(c.h1,60,6);
  ctx.beginPath();
  ctx.moveTo(0,CHAO_Y);
  const mStep=LARGURA/6;
  for(let i=0;i<=6;i++){
    const mx=i*mStep;
    const my=CHAO_Y-30*ESCALA-Math.abs(Math.sin(i*1.7+1))*40*ESCALA;
    ctx.lineTo(mx,my);
  }
  ctx.lineTo(LARGURA,CHAO_Y);
  ctx.closePath();
  ctx.fill();
}

/* ══════════ DESENHO — CHÃO NEON COM GRADE ══════════ */
function desenharChaoSynth(){
  const c=corAtual();
  const h=ALTURA-CHAO_Y;

  /* Base escura */
  const g=ctx.createLinearGradient(0,CHAO_Y,0,ALTURA);
  g.addColorStop(0, hsla(c.h1,80,10));
  g.addColorStop(0.5,hsla(c.h1,80,6));
  g.addColorStop(1, '#05010f');
  ctx.fillStyle=g;
  ctx.fillRect(0,CHAO_Y,LARGURA,h);

  /* Linha do horizonte com glow */
  ctx.save();
  ctx.shadowColor=hsla(c.h1,100,60,1);
  ctx.shadowBlur=18*ESCALA;
  ctx.strokeStyle=hsla(c.h1,100,70);
  ctx.lineWidth=2.5*ESCALA;
  ctx.beginPath();
  ctx.moveTo(0,CHAO_Y);
  ctx.lineTo(LARGURA,CHAO_Y);
  ctx.stroke();
  ctx.restore();

  /* Linhas horizontais da grade (em perspectiva, subindo) */
  ctx.save();
  ctx.strokeStyle=hsla(c.h2,100,60,0.55);
  ctx.lineWidth=1.2*ESCALA;
  ctx.shadowColor=hsla(c.h2,100,60,0.9);
  ctx.shadowBlur=6*ESCALA;
  const nLin=8;
  const offset=(estado.deslocGrade/(60*ESCALA));
  for(let i=0;i<nLin;i++){
    let t=(i+offset)/nLin;
    t=t-Math.floor(t);
    // distribuição em perspectiva (exponencial)
    const yPersp=Math.pow(t,2.2);
    const y=CHAO_Y+yPersp*h;
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(LARGURA,y);
    ctx.stroke();
  }
  ctx.restore();

  /* Linhas verticais (convergem para o centro) */
  ctx.save();
  ctx.strokeStyle=hsla(c.h1,100,60,0.55);
  ctx.lineWidth=1.2*ESCALA;
  ctx.shadowColor=hsla(c.h1,100,60,0.9);
  ctx.shadowBlur=6*ESCALA;
  const centro=LARGURA/2;
  const nV=14;
  for(let i=0;i<=nV;i++){
    const xTop=centro+(i/nV-0.5)*LARGURA*0.35;
    const xBot=centro+(i/nV-0.5)*LARGURA*2.5;
    ctx.beginPath();
    ctx.moveTo(xTop,CHAO_Y);
    ctx.lineTo(xBot,ALTURA);
    ctx.stroke();
  }
  ctx.restore();
}

/* ══════════ DESENHO — OBSTÁCULO (silhueta + neon) ══════════ */
function desenharObstaculo(o){
  const c=corAtual();
  const corNeon = o.tipo==='projetilBoss'
    ? '#ff5050'
    : hsla(c.h1,100,65);

  /* Desenha o corpo como retângulo/círculo arredondado preto */
  ctx.save();
  ctx.shadowColor=corNeon;
  ctx.shadowBlur=14*ESCALA;
  ctx.strokeStyle=corNeon;
  ctx.lineWidth=2.5*ESCALA;
  ctx.fillStyle='rgba(8,3,20,0.9)';

  const x=o.x, y=o.y, w=o.largura, h=o.altura;
  const r=Math.min(w,h)*0.18;

  if(o.tipo==='pneu'){
    const cx=x+w/2, cy=y+h/2, rr=Math.min(w,h)/2-2*ESCALA;
    ctx.beginPath(); ctx.arc(cx,cy,rr,0,Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,rr*0.45,0,Math.PI*2);
    ctx.strokeStyle=corNeon; ctx.stroke();
    /* raios */
    for(let i=0;i<8;i++){
      const a=i/8*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*rr*0.5,cy+Math.sin(a)*rr*0.5);
      ctx.lineTo(cx+Math.cos(a)*rr*0.9,cy+Math.sin(a)*rr*0.9);
      ctx.stroke();
    }
  } else if(o.tipo==='engrenagem'||o.tipo==='projetilBoss'){
    const cx=x+w/2, cy=y+h/2, rr=Math.min(w,h)/2-2*ESCALA;
    const dentes=9, rI=rr*0.75;
    ctx.beginPath();
    for(let i=0;i<dentes*2;i++){
      const a=(i/(dentes*2))*Math.PI*2-Math.PI/2+(o.rotacao||0);
      const rr2=i%2===0?rr:rI;
      const px=cx+Math.cos(a)*rr2, py=cy+Math.sin(a)*rr2;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx,cy,rr*0.35,0,Math.PI*2); ctx.stroke();
  } else if(o.tipo==='caixa'||o.tipo==='engradado'||o.tipo==='chip'){
    arredondado(x,y,w,h,r); ctx.fill(); ctx.stroke();
    /* linhas internas */
    ctx.beginPath();
    ctx.moveTo(x+4*ESCALA,y+4*ESCALA);
    ctx.lineTo(x+w-4*ESCALA,y+h-4*ESCALA);
    ctx.moveTo(x+w-4*ESCALA,y+4*ESCALA);
    ctx.lineTo(x+4*ESCALA,y+h-4*ESCALA);
    ctx.stroke();
  } else if(o.tipo==='barra'||o.tipo==='tabua'){
    arredondado(x,y,w,h,r*0.5); ctx.fill(); ctx.stroke();
    /* divisões */
    ctx.beginPath();
    ctx.moveTo(x,y+h/2); ctx.lineTo(x+w,y+h/2);
    ctx.stroke();
  } else if(o.tipo==='bigorna'){
    arredondado(x+w*0.1,y+h*0.1,w*0.8,h*0.3,r);
    ctx.fill(); ctx.stroke();
    arredondado(x+w*0.25,y+h*0.4,w*0.5,h*0.35,r);
    ctx.fill(); ctx.stroke();
    arredondado(x+w*0.1,y+h*0.75,w*0.8,h*0.2,r);
    ctx.fill(); ctx.stroke();
  } else {
    /* qualquer outro: bloco arredondado */
    arredondado(x,y,w,h,r); ctx.fill(); ctx.stroke();
    /* detalhe no topo */
    ctx.beginPath();
    ctx.moveTo(x+w*0.2,y+h*0.15);
    ctx.lineTo(x+w*0.8,y+h*0.15);
    ctx.stroke();
  }
  ctx.restore();
}

/* ══════════ DESENHO — DRONE NEON ══════════ */
function desenharDrone(d){
  const c=corAtual();
  const neon=hsla(c.h2,100,65);
  ctx.save();
  ctx.shadowColor=neon; ctx.shadowBlur=12*ESCALA;
  ctx.strokeStyle=neon; ctx.lineWidth=2*ESCALA;
  ctx.fillStyle='rgba(8,3,20,0.85)';

  const x=d.x,y=d.y,w=d.largura,h=d.altura;
  arredondado(x+w*0.15,y+h*0.2,w*0.7,h*0.7,5*ESCALA);
  ctx.fill(); ctx.stroke();

  /* olho */
  ctx.fillStyle='#ff2050';
  ctx.shadowColor='#ff2050';
  ctx.beginPath(); ctx.arc(x+w*0.5,y+h*0.55,4*ESCALA,0,Math.PI*2); ctx.fill();

  /* hélice */
  ctx.shadowBlur=0;
  ctx.beginPath();
  ctx.moveTo(x+w*0.5,y+h*0.2); ctx.lineTo(x+w*0.5,y);
  ctx.stroke();
  ctx.save();
  ctx.translate(x+w*0.5,y-2*ESCALA);
  ctx.rotate(d.helic);
  ctx.strokeStyle=neon; ctx.lineWidth=3*ESCALA;
  ctx.beginPath(); ctx.moveTo(-14*ESCALA,0); ctx.lineTo(14*ESCALA,0); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

/* ══════════ DESENHO — MOEDA NEON ══════════ */
function desenharMoeda(m){
  const cx=m.x+m.largura/2, cy=m.y+m.altura/2+Math.sin(m.bob)*4*ESCALA;
  const sx=Math.abs(Math.cos(m.rot))*0.8+0.2;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(sx,1);
  ctx.shadowColor='#ffcc00'; ctx.shadowBlur=14*ESCALA;
  ctx.fillStyle='#ffcc00';
  ctx.beginPath(); ctx.arc(0,0,9*ESCALA,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#ffffff';
  ctx.beginPath(); ctx.arc(0,0,4*ESCALA,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ══════════ DESENHO — POWER-UP NEON ══════════ */
function desenharPowerUp(p){
  const cx=p.x+p.largura/2, cy=p.y+p.altura/2+Math.sin(p.bob)*4*ESCALA;
  const cores={
    escudo:['#00c8ff','#00f5ff'],
    ima:['#a855f7','#e0b0ff'],
    lento:['#00ff88','#b4ffd0'],
    inv:['#ffaa00','#ffe066'],
    super:['#ff2ec4','#ffb4e0']
  }[p.tipo];
  const hexCor=cores[0];

  ctx.save();
  ctx.shadowColor=hexCor; ctx.shadowBlur=18*ESCALA;

  /* Hexágono */
  ctx.translate(cx,cy);
  ctx.rotate(Math.sin(p.bob*0.5)*0.12);
  ctx.fillStyle='rgba(8,3,20,0.9)';
  ctx.strokeStyle=cores[1];
  ctx.lineWidth=2.5*ESCALA;
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2-Math.PI/2;
    const px=Math.cos(a)*16*ESCALA, py=Math.sin(a)*16*ESCALA;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  /* Símbolo */
  ctx.fillStyle=cores[1];
  ctx.strokeStyle=cores[1];
  ctx.lineWidth=4*ESCALA;
  ctx.lineCap='round';
  if(p.tipo==='escudo'){
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=(i/10)*Math.PI*2-Math.PI/2;
      const rr=i%2===0?9*ESCALA:3.5*ESCALA;
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  } else if(p.tipo==='ima'){
    ctx.beginPath();
    ctx.arc(0,0,8*ESCALA,Math.PI*0.15,Math.PI*0.85,true);
    ctx.stroke();
  } else if(p.tipo==='lento'){
    ctx.beginPath(); ctx.arc(0,0,8*ESCALA,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-6*ESCALA);
    ctx.moveTo(0,0); ctx.lineTo(5*ESCALA,3*ESCALA); ctx.stroke();
  } else if(p.tipo==='inv'){
    ctx.beginPath(); ctx.ellipse(0,0,10*ESCALA,6*ESCALA,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(8,3,20,0.9)';
    ctx.beginPath(); ctx.arc(0,0,3*ESCALA,0,Math.PI*2); ctx.fill();
  } else if(p.tipo==='super'){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=(i/5)*Math.PI*2-Math.PI/2;
      const px=Math.cos(a)*10*ESCALA, py=Math.sin(a)*10*ESCALA;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ══════════ DESENHO — BOSS NEON ══════════ */
function desenharBoss(){
  if(!boss.ativo&&boss.entrada<=0) return;
  const prog=Math.min(1,boss.entrada);
  const ease=1-Math.pow(1-prog,3);
  const offX=(1-ease)*300*ESCALA;
  const bw=190*ESCALA, bh=210*ESCALA;
  const bx=LARGURA-bw-20*ESCALA+offX, by=CHAO_Y-bh;
  const flash=boss.hitFlash>0&&Math.sin(estado.frame*0.9)>0;
  const neon=flash?'#ff8080':'#ff2ec4';

  ctx.save();
  ctx.shadowColor=neon; ctx.shadowBlur=20*ESCALA;
  ctx.strokeStyle=neon; ctx.lineWidth=3*ESCALA;
  ctx.fillStyle='rgba(8,3,20,0.9)';

  /* pernas */
  arredondado(bx+bw*0.15,by+bh*0.78,bw*0.28,bh*0.22,6*ESCALA);
  ctx.fill(); ctx.stroke();
  arredondado(bx+bw*0.57,by+bh*0.78,bw*0.28,bh*0.22,6*ESCALA);
  ctx.fill(); ctx.stroke();

  /* corpo */
  arredondado(bx+bw*0.1,by+bh*0.35,bw*0.8,bh*0.45,10*ESCALA);
  ctx.fill(); ctx.stroke();

  /* núcleo */
  ctx.fillStyle=neon;
  ctx.beginPath(); ctx.arc(bx+bw*0.5,by+bh*0.55,12*ESCALA,0,Math.PI*2); ctx.fill();

  /* cabeça */
  arredondado(bx+bw*0.2,by+bh*0.05,bw*0.6,bh*0.28,8*ESCALA);
  ctx.fill(); ctx.stroke();

  /* olhos */
  const pulsar=0.6+0.4*Math.sin(estado.frame*0.15);
  ctx.fillStyle=`rgba(255,50,80,${pulsar})`;
  ctx.shadowColor='#ff2050';
  ctx.beginPath();
  ctx.arc(bx+bw*0.36,by+bh*0.18,7*ESCALA,0,Math.PI*2);
  ctx.arc(bx+bw*0.64,by+bh*0.18,7*ESCALA,0,Math.PI*2);
  ctx.fill();

  /* braço */
  ctx.shadowColor=neon;
  ctx.fillStyle='rgba(8,3,20,0.9)';
  ctx.strokeStyle=neon;
  arredondado(bx+bw*0.85,by+bh*0.32,bw*0.22,bh*0.14,6*ESCALA);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}

/* ══════════ DESENHO — JOGADOR NEON ══════════ */
function desenharJogador(){
  const skin=SKINS[skinAtual];
  const px=jogador.x, py=jogador.y;
  const w=jogador.largura, h=jogador.alturaAtual;
  const topo=py-h;

  /* rastro */
  for(let i=0;i<jogador.rastro.length;i++){
    const r=jogador.rastro[i];
    const a=r.vida/0.4;
    ctx.save(); ctx.globalAlpha=a*0.4;
    ctx.fillStyle=skin.c1;
    ctx.beginPath();
    ctx.ellipse(r.x,r.y,(10*a+3)*ESCALA,(16*a+4)*ESCALA,0,0,Math.PI*2);
    ctx.fill(); ctx.restore();
  }

  /* aura escudo / dash */
  if(estado.powerUps.escudo>0||jogador.dashTempo>0){
    const pulso=0.75+0.25*Math.sin(estado.frame*0.3);
    ctx.save();
    ctx.globalAlpha=0.75;
    const gA=ctx.createRadialGradient(px+w/2,py-h/2,10*ESCALA,px+w/2,py-h/2,55*ESCALA);
    gA.addColorStop(0,'rgba(0,245,255,0)');
    gA.addColorStop(0.7,`rgba(0,245,255,${0.3*pulso})`);
    gA.addColorStop(1,'rgba(0,245,255,0.6)');
    ctx.fillStyle=gA;
    ctx.beginPath(); ctx.arc(px+w/2,py-h/2,55*ESCALA,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  /* Piscar quando invulnerável */
  const piscando=(jogador.invuln>0)&&(Math.floor(estado.frame*0.15)%2===0);
  ctx.save();
  if(piscando) ctx.globalAlpha=0.35;

  /* sombra neon no chão */
  const altAr=Math.max(0,CHAO_Y-py);
  const f=Math.max(0.3,1-altAr/(170*ESCALA));
  ctx.save();
  ctx.globalAlpha=ctx.globalAlpha*0.5*f;
  ctx.shadowColor=skin.c1;
  ctx.shadowBlur=14*ESCALA;
  ctx.fillStyle=skin.c1;
  ctx.beginPath();
  ctx.ellipse(px+w/2,CHAO_Y+2*ESCALA,(w/2+6*ESCALA)*f,4*ESCALA*f,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  /* Corpo do personagem */
  ctx.shadowColor=skin.c1;
  ctx.shadowBlur=16*ESCALA;

  /* pernas */
  ctx.fillStyle='rgba(8,3,20,0.9)';
  ctx.strokeStyle=skin.c1;
  ctx.lineWidth=2*ESCALA;
  const correndo=jogador.noChao&&estado.tela!=='fim';
  if(correndo){
    const s=Math.sin(estado.frame*0.32)*5*ESCALA;
    arredondado(px+7*ESCALA+s,py-11*ESCALA,10*ESCALA,11*ESCALA,4*ESCALA);
    ctx.fill(); ctx.stroke();
    arredondado(px+21*ESCALA-s,py-11*ESCALA,10*ESCALA,11*ESCALA,4*ESCALA);
    ctx.fill(); ctx.stroke();
  } else if(jogador.agachando){
    arredondado(px+4*ESCALA,py-6*ESCALA,12*ESCALA,7*ESCALA,3*ESCALA);
    ctx.fill(); ctx.stroke();
    arredondado(px+22*ESCALA,py-6*ESCALA,12*ESCALA,7*ESCALA,3*ESCALA);
    ctx.fill(); ctx.stroke();
  } else {
    arredondado(px+8*ESCALA,py-9*ESCALA,10*ESCALA,9*ESCALA,4*ESCALA);
    ctx.fill(); ctx.stroke();
    arredondado(px+20*ESCALA,py-9*ESCALA,10*ESCALA,9*ESCALA,4*ESCALA);
    ctx.fill(); ctx.stroke();
  }

  /* corpo */
  const g=ctx.createLinearGradient(px,topo,px+w,topo+h);
  g.addColorStop(0,skin.c1);
  g.addColorStop(1,skin.c2);
  ctx.fillStyle=g;
  arredondado(px,topo,w,h-6*ESCALA,13*ESCALA);
  ctx.fill(); ctx.stroke();

  /* olhos */
  const olhoY=topo+(jogador.agachando?10:15)*ESCALA;
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.arc(px+13*ESCALA,olhoY,3*ESCALA,0,Math.PI*2);
  ctx.arc(px+26*ESCALA,olhoY,3*ESCALA,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle='#0a0014';
  ctx.beginPath();
  ctx.arc(px+14*ESCALA,olhoY,1.6*ESCALA,0,Math.PI*2);
  ctx.arc(px+27*ESCALA,olhoY,1.6*ESCALA,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

/* ══════════ HUD ══════════ */
function desenharHUD(){
  ctx.save();
  ctx.textBaseline='top';
  const H=clamp(ALTURA/380,0.7,1.6);
  const safe=getSafeInsets();
  const padX=Math.max(16*H,safe.left+12);
  const padY=Math.max(16*H,safe.top+12);
  const padR=Math.max(16*H,safe.right+12);
  const c=corAtual();

  /* pontuação (topo direito) */
  ctx.textAlign='right';
  ctx.font=`bold ${26*H}px ui-monospace, Menlo, Consolas, monospace`;
  ctx.shadowColor=hsla(c.h1,100,60,1); ctx.shadowBlur=12;
  ctx.fillStyle='#ffffff';
  ctx.fillText(String(estado.pontos).padStart(5,'0'),LARGURA-padR,padY);

  const mult=(estado.powerUps.ima>0?2:1)*(1+estado.combo*0.5);
  if(mult>1){
    ctx.font=`bold ${15*H}px ui-monospace, Menlo, monospace`;
    ctx.fillStyle=hsla(c.h2,100,65);
    ctx.shadowColor=hsla(c.h2,100,65,1);
    ctx.fillText('×'+mult.toFixed(1).replace('.0',''),LARGURA-padR-85*H,padY+8*H);
  }

  /* recorde / moedas (topo esquerdo) */
  ctx.textAlign='left';
  ctx.font=`bold ${12*H}px ui-monospace, monospace`;
  ctx.shadowBlur=6;
  ctx.shadowColor='rgba(0,0,0,0.8)';
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.fillText('REC '+String(recorde).padStart(5,'0'),padX,padY+6*H);
  ctx.fillStyle='#ffcc00';
  ctx.shadowColor='#ffcc00';
  ctx.fillText('◆ '+moedasTotais+'  +'+estado.moedasRun,padX,padY+24*H);
  ctx.shadowColor='rgba(0,0,0,0.8)';

  /* vidas (corações) */
  const corY=padY+50*H;
  for(let i=0;i<VIDA_MAX;i++){
    const hx=padX+i*22*H;
    const t=7*H;
    if(i<jogador.vidas){
      ctx.fillStyle=hsla(c.h1,100,60);
      ctx.shadowColor=hsla(c.h1,100,60);
      ctx.shadowBlur=10;
    } else {
      ctx.fillStyle='rgba(255,255,255,0.15)';
      ctx.shadowBlur=0;
    }
    ctx.beginPath();
    ctx.moveTo(hx+t,corY+t*1.6);
    ctx.bezierCurveTo(hx-t*0.2,corY+t*0.7,hx+t*0.2,corY-t*0.2,hx+t,corY+t*0.55);
    ctx.bezierCurveTo(hx+t*1.8,corY-t*0.2,hx+t*2.2,corY+t*0.7,hx+t,corY+t*1.6);
    ctx.closePath(); ctx.fill();
  }
  ctx.shadowBlur=0;

  /* fase atual (centro) */
  ctx.textAlign='center';
  ctx.font=`bold ${13*H}px ui-monospace, monospace`;
  ctx.shadowColor=hsla(c.h1,100,60,0.9); ctx.shadowBlur=10;
  ctx.fillStyle=hsla(c.h1,100,75);
  if(isBossPhase()){
    ctx.fillStyle='#ff5050';
    ctx.shadowColor='#ff5050';
    ctx.fillText('◆ BOSS · ROBÔ GIGANTE ◆',LARGURA/2,padY);
  } else {
    ctx.fillText(FASES[estado.faseIdx].nome+' · '+(estado.faseIdx+1)+'/'+FASES.length+
      (estado.ciclo>0?' · CICLO '+(estado.ciclo+1):''),LARGURA/2,padY);
  }

  /* barra de progresso */
  if(!isBossPhase()){
    const barW=160*H,barH=3*H,barX=(LARGURA-barW)/2,barY=padY+20*H;
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.15)';
    arredondado(barX,barY,barW,barH,2*H); ctx.fill();
    const prog=Math.min(1,estado.faseTempo/FASE_DURACAO);
    ctx.fillStyle=hsla(c.h1,100,65);
    ctx.shadowColor=hsla(c.h1,100,65);
    ctx.shadowBlur=8;
    arredondado(barX,barY,barW*prog,barH,2*H); ctx.fill();
    ctx.shadowBlur=0;
  }

  /* barra HP do boss */
  if(isBossPhase()&&boss.ativo){
    const barW=Math.min(320*H,LARGURA*0.6),barH=14*H;
    const barX=(LARGURA-barW)/2,barY=padY+18*H;
    ctx.fillStyle='rgba(0,0,0,0.6)';
    arredondado(barX-3*H,barY-3*H,barW+6*H,barH+6*H,5*H); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.1)';
    arredondado(barX,barY,barW,barH,4*H); ctx.fill();
    const prop=Math.max(0,boss.hp/boss.maxHp);
    ctx.fillStyle='#ff2050';
    ctx.shadowColor='#ff2050';
    ctx.shadowBlur=12;
    arredondado(barX,barY,barW*prop,barH,4*H); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font=`bold ${10*H}px ui-monospace, monospace`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('HP '+boss.hp+' / '+boss.maxHp,LARGURA/2,barY+barH/2+H);
    ctx.textBaseline='top';
  }

  /* combo */
  if(estado.combo>0){
    ctx.textAlign='center';
    ctx.font=`bold ${15*H}px ui-monospace, monospace`;
    ctx.fillStyle='#ffcc00';
    ctx.shadowColor='#ffcc00'; ctx.shadowBlur=12;
    ctx.fillText('COMBO ×'+estado.combo,LARGURA/2,ALTURA*0.22);
    ctx.shadowBlur=0;
  }

  /* ícones de power-up ativos */
  const dur={escudo:5,ima:8,lento:5,inv:5,super:8};
  const ordem=['escudo','ima','lento','inv','super'];
  const ativos=ordem.filter(k=>estado.powerUps[k]>0);
  const bY=ALTURA-40*H-safe.bottom;
  let pxIcon=padX;
  for(const k of ativos){
    desenharIconePU(pxIcon,bY,k,estado.powerUps[k]/dur[k],H);
    pxIcon+=36*H;
  }

  /* dash bar (desktop) */
  if(!isTouch){
    const dashW=56*H,dashH=4*H;
    const dashX=padX,dashY=ALTURA-16*H-safe.bottom;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    arredondado(dashX,dashY,dashW,dashH,2*H); ctx.fill();
    const dashP=1-Math.max(0,jogador.dashCd/DASH_CD);
    ctx.fillStyle=dashP>=1?'#00f5ff':'rgba(0,245,255,0.6)';
    ctx.shadowColor='#00f5ff'; ctx.shadowBlur=dashP>=1?10:0;
    arredondado(dashX,dashY,dashW*dashP,dashH,2*H); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.font=`bold ${9*H}px ui-monospace, monospace`;
    ctx.textAlign='left'; ctx.textBaseline='top';
    ctx.fillText('DASH [X]',dashX+dashW+6*H,dashY-2*H);
  }

  ctx.restore();
}

function desenharIconePU(x,y,tipo,prog,H){
  const size=30*H;
  const cor={escudo:'#00f5ff',ima:'#a855f7',lento:'#00ff88',inv:'#ffaa00',super:'#ff2ec4'}[tipo];
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.55)';
  ctx.beginPath(); ctx.arc(x+size/2,y+size/2,size/2+2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=cor; ctx.lineWidth=2.5;
  ctx.shadowColor=cor; ctx.shadowBlur=8;
  ctx.beginPath();
  ctx.arc(x+size/2,y+size/2,size/2+1,-Math.PI/2,-Math.PI/2+Math.PI*2*prog);
  ctx.stroke();
  ctx.fillStyle=cor;
  ctx.beginPath(); ctx.arc(x+size/2,y+size/2,size/2-2,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#fff';
  if(tipo==='escudo'||tipo==='super'){
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=(i/10)*Math.PI*2-Math.PI/2;
      const rr=i%2===0?7:2.5;
      const px=x+size/2+Math.cos(a)*rr, py=y+size/2+Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  } else if(tipo==='ima'){
    ctx.strokeStyle='#fff'; ctx.lineWidth=3.5; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(x+size/2,y+size/2,6,Math.PI*0.15,Math.PI*0.85,true); ctx.stroke();
  } else if(tipo==='lento'){
    ctx.beginPath(); ctx.arc(x+size/2,y+size/2,7,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=cor; ctx.lineWidth=1.8;
    ctx.beginPath(); ctx.moveTo(x+size/2,y+size/2); ctx.lineTo(x+size/2,y+size/2-4.5);
    ctx.moveTo(x+size/2,y+size/2); ctx.lineTo(x+size/2+3.5,y+size/2+2.5); ctx.stroke();
  } else if(tipo==='inv'){
    ctx.beginPath(); ctx.ellipse(x+size/2,y+size/2,8,5.5,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=cor;
    ctx.beginPath(); ctx.arc(x+size/2,y+size/2,2.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

/* ══════════ BOTÕES VIRTUAIS ══════════ */
function desenharBotoes(){
  if(!isTouch) return;
  if(botoesAlpha<0.02) return;
  for(const k of ['agacha','dash','pulo']){
    const b=botoes[k];
    const alpha=b.ativo?1:botoesAlpha;
    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.shadowColor=b.cor;
    ctx.shadowBlur=b.ativo?20:8;
    /* Fundo */
    ctx.fillStyle='rgba(8,3,20,0.6)';
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    /* Anel */
    ctx.strokeStyle=b.cor;
    ctx.lineWidth=b.ativo?2.5:1.5;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r-1,0,Math.PI*2); ctx.stroke();
    /* Ícone */
    ctx.shadowBlur=0;
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=Math.max(2,b.r*0.14);
    ctx.lineCap='round';
    ctx.lineJoin='round';
    const s=b.r*0.42;
    if(k==='pulo'){
      ctx.beginPath();
      ctx.moveTo(b.x-s,b.y+s*0.4);
      ctx.lineTo(b.x,b.y-s*0.6);
      ctx.lineTo(b.x+s,b.y+s*0.4);
      ctx.stroke();
    } else if(k==='agacha'){
      ctx.beginPath();
      ctx.moveTo(b.x-s,b.y-s*0.4);
      ctx.lineTo(b.x,b.y+s*0.6);
      ctx.lineTo(b.x+s,b.y-s*0.4);
      ctx.stroke();
    } else {
      const gs=s*0.85;
      ctx.beginPath();
      ctx.moveTo(b.x-gs,b.y-gs*0.75);
      ctx.lineTo(b.x,b.y);
      ctx.lineTo(b.x-gs,b.y+gs*0.75);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(b.x,b.y-gs*0.75);
      ctx.lineTo(b.x+gs,b.y);
      ctx.lineTo(b.x,b.y+gs*0.75);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* ══════════ VINHETA ══════════ */
function desenharVinheta(){
  const g=ctx.createRadialGradient(LARGURA/2,ALTURA/2,Math.min(LARGURA,ALTURA)*0.35,
                                    LARGURA/2,ALTURA/2,Math.max(LARGURA,ALTURA)*0.75);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.4)');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,LARGURA,ALTURA);
}

/* ══════════ BANNER / MENU / FIM ══════════ */
function desenharBanner(){
  if(estado.tela!=='jogando') return;
  let texto,sub,prog;
  if(estado.aviso>0){
    if(isBossPhase()){texto='◆ BOSS ◆';sub='Robô Gigante';}
    else{texto=FASES[estado.faseIdx].nome;sub='FASE '+(estado.faseIdx+1)+' / '+FASES.length;}
    prog=1-estado.aviso/FASE_INTRO;
  } else if(estado.concluindo>0){
    if(isBossPhase()){texto='BOSS DERROTADO';sub='Ciclo concluído';}
    else{
      texto='FASE CONCLUÍDA';
      sub='★'.repeat(estado.estrelas)+'☆'.repeat(3-estado.estrelas);
    }
    prog=1-estado.concluindo/FASE_OUTRO;
  } else return;

  let alpha=1;
  if(prog<0.15) alpha=prog/0.15;
  else if(prog>0.85) alpha=(1-prog)/0.15;
  alpha=clamp(alpha,0,1);

  const c=corAtual();
  ctx.save();
  ctx.globalAlpha=alpha;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.font=`bold ${Math.min(48*ESCALA,LARGURA*0.08)}px ui-monospace, monospace`;
  ctx.fillStyle='#ffffff';
  ctx.shadowColor=hsla(c.h1,100,60,1);
  ctx.shadowBlur=25;
  ctx.fillText(texto,LARGURA/2,ALTURA*0.42);
  ctx.font=`bold ${Math.min(20*ESCALA,LARGURA*0.035)}px ui-monospace, monospace`;
  ctx.fillStyle=hsla(c.h2,100,70);
  ctx.shadowBlur=15;
  ctx.fillText(sub,LARGURA/2,ALTURA*0.55);
  ctx.restore();
}

function desenharMenu(){
  const c=corAtual();
  ctx.save();
  ctx.fillStyle='rgba(5,1,15,0.72)';
  ctx.fillRect(0,0,LARGURA,ALTURA);

  ctx.textAlign='center'; ctx.textBaseline='middle';

  /* Título neon */
  const titTam=Math.min(46*ESCALA,LARGURA*0.075);
  ctx.font=`bold ${titTam}px ui-monospace, monospace`;
  ctx.fillStyle='#ffffff';
  ctx.shadowColor='#ff2ec4'; ctx.shadowBlur=25;
  ctx.fillText('NEON',LARGURA/2,ALTURA*0.10);
  ctx.fillStyle='#00f5ff';
  ctx.shadowColor='#00f5ff';
  ctx.fillText('RUNNER',LARGURA/2,ALTURA*0.10+titTam*0.85);

  ctx.font=`bold ${13*ESCALA}px ui-monospace, monospace`;
  ctx.shadowBlur=10;
  ctx.fillStyle=hsla(c.h2,100,65);
  ctx.fillText('◆ 6 FASES  ·  POWER-UPS  ·  BOSS FINAL ◆',LARGURA/2,ALTURA*0.28);

  /* Fases como cartões */
  const nF=FASES.length+1;
  const cardW=Math.min(90*ESCALA,LARGURA*0.095);
  const gapC=Math.min(8*ESCALA,LARGURA*0.006);
  const totW=nF*cardW+(nF-1)*gapC;
  let cx0=(LARGURA-totW)/2+cardW/2;
  const cy=ALTURA*0.38;
  for(let i=0;i<FASES.length;i++){
    const cx=cx0+i*(cardW+gapC);
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(8,3,20,0.85)';
    arredondado(cx-cardW/2,cy-16*ESCALA,cardW,30*ESCALA,6*ESCALA); ctx.fill();
    ctx.strokeStyle=hsla(FASES[i].h1,100,60);
    ctx.lineWidth=1.5*ESCALA;
    ctx.shadowColor=hsla(FASES[i].h1,100,60);
    ctx.shadowBlur=10;
    arredondado(cx-cardW/2,cy-16*ESCALA,cardW,30*ESCALA,6*ESCALA); ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font=`bold ${8*ESCALA}px ui-monospace, monospace`;
    ctx.fillText(FASES[i].nome,cx,cy);
  }
  const cxB=cx0+FASES.length*(cardW+gapC);
  ctx.fillStyle='rgba(20,0,10,0.85)';
  arredondado(cxB-cardW/2,cy-16*ESCALA,cardW,30*ESCALA,6*ESCALA); ctx.fill();
  ctx.strokeStyle='#ff2050';
  ctx.shadowColor='#ff2050';
  ctx.shadowBlur=12;
  arredondado(cxB-cardW/2,cy-16*ESCALA,cardW,30*ESCALA,6*ESCALA); ctx.stroke();
  ctx.shadowBlur=0;
  ctx.fillStyle='#ff2050';
  ctx.font=`bold ${9*ESCALA}px ui-monospace, monospace`;
  ctx.fillText('◆ BOSS',cxB,cy);

  /* Instruções */
  ctx.font=`bold ${12*ESCALA}px ui-monospace, monospace`;
  ctx.fillStyle='rgba(255,255,255,0.85)';
  ctx.shadowBlur=6; ctx.shadowColor='#00f5ff';
  if(isTouch){
    ctx.fillText('TOQUE NA TELA = PULAR · BOTÕES INFERIORES = AGACHAR / DASH',LARGURA/2,ALTURA*0.48);
  } else {
    ctx.fillText('ESPAÇO= PULAR · ↓/S= AGACHAR · X= DASH · CLIQUE DIR.= DASH',LARGURA/2,ALTURA*0.48);
  }

  /* Power-ups */
  ctx.font=`bold ${10*ESCALA}px ui-monospace, monospace`;
  ctx.fillStyle='rgba(180,220,255,0.9)';
  ctx.shadowBlur=0;
  ctx.fillText('🛡 ESCUDO · 🧲 ÍMÃ · ⏱ LENTO · 👁 INVISÍVEL · ★ SUPER',LARGURA/2,ALTURA*0.55);

  /* Skins */
  ctx.font=`bold ${11*ESCALA}px ui-monospace, monospace`;
  ctx.fillStyle='#fff';
  ctx.shadowColor='#ff2ec4'; ctx.shadowBlur=10;
  ctx.fillText('SKINS',LARGURA/2,ALTURA*0.62);

  const sW=Math.min(90*ESCALA,LARGURA*0.095);
  const sH=50*ESCALA;
  const sGap=Math.min(8*ESCALA,LARGURA*0.006);
  const sTot=SKINS.length*sW+(SKINS.length-1)*sGap;
  const sX0=(LARGURA-sTot)/2;
  const sY=ALTURA*0.65;
  for(let i=0;i<SKINS.length;i++){
    const sx=sX0+i*(sW+sGap);
    const un=skinsDesbloq.includes(i);
    const sel=skinAtual===i;
    ctx.shadowBlur=0;
    ctx.fillStyle=un?'rgba(8,3,20,0.85)':'rgba(15,10,25,0.7)';
    arredondado(sx,sY,sW,sH,8*ESCALA); ctx.fill();
    ctx.strokeStyle=sel?SKINS[i].c1:un?'rgba(150,150,200,0.5)':'rgba(60,60,80,0.5)';
    ctx.lineWidth=sel?3*ESCALA:1.5*ESCALA;
    if(sel){ctx.shadowColor=SKINS[i].c1;ctx.shadowBlur=15;}
    arredondado(sx,sY,sW,sH,8*ESCALA); ctx.stroke();
    ctx.shadowBlur=0;

    /* miniatura */
    ctx.fillStyle=SKINS[i].c1;
    ctx.beginPath(); ctx.arc(sx+18*ESCALA,sY+sH/2,9*ESCALA,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=SKINS[i].c2;
    ctx.beginPath(); ctx.arc(sx+18*ESCALA,sY+sH/2,9*ESCALA,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=SKINS[i].c1;
    ctx.beginPath(); ctx.arc(sx+18*ESCALA,sY+sH/2,6*ESCALA,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(sx+15*ESCALA,sY+sH/2-2*ESCALA,1.5*ESCALA,0,Math.PI*2);
    ctx.arc(sx+21*ESCALA,sY+sH/2-2*ESCALA,1.5*ESCALA,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=un?'#fff':'rgba(180,180,180,0.7)';
    ctx.font=`bold ${9*ESCALA}px ui-monospace, monospace`;
    ctx.textAlign='left';
    ctx.fillText(SKINS[i].nome,sx+34*ESCALA,sY+20*ESCALA);
    if(un){
      ctx.fillStyle='rgba(150,255,150,0.9)';
      ctx.font=`bold ${8*ESCALA}px ui-monospace, monospace`;
      ctx.fillText(sel?'✓':'',sx+34*ESCALA,sY+36*ESCALA);
    } else {
      ctx.fillStyle=SKINS[i].preco<=moedasTotais?'#ffcc00':'rgba(255,120,120,0.8)';
      ctx.font=`bold ${8*ESCALA}px ui-monospace, monospace`;
      ctx.fillText('◆ '+SKINS[i].preco,sx+34*ESCALA,sY+36*ESCALA);
    }
    ctx.textAlign='center';
  }

  /* Começar */
  const a=0.5+0.5*Math.sin(estado.frame*0.08);
  ctx.globalAlpha=a;
  ctx.fillStyle='#00f5ff';
  ctx.shadowColor='#00f5ff';
  ctx.shadowBlur=20;
  ctx.font=`bold ${20*ESCALA}px ui-monospace, monospace`;
  ctx.fillText(isTouch?'TOQUE PARA COMEÇAR':'PRESSIONE ESPAÇO',LARGURA/2,ALTURA*0.85);
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  /* rodapé */
  const safe=getSafeInsets();
  ctx.fillStyle='#ffcc00';
  ctx.font=`bold ${12*ESCALA}px ui-monospace, monospace`;
  ctx.textAlign='right';
  ctx.fillText('◆ '+moedasTotais,LARGURA-16*ESCALA-safe.right,ALTURA-14*ESCALA-safe.bottom);
  ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText('REC: '+recorde,16*ESCALA+safe.left,ALTURA-14*ESCALA-safe.bottom);

  ctx.restore();
}

function desenharFim(){
  ctx.save();
  ctx.fillStyle='rgba(5,1,15,0.8)';
  ctx.fillRect(0,0,LARGURA,ALTURA);

  ctx.textAlign='center'; ctx.textBaseline='middle';

  const c=corAtual();

  ctx.font=`bold ${Math.min(50*ESCALA,LARGURA*0.075)}px ui-monospace, monospace`;
  ctx.fillStyle='#ff2050';
  ctx.shadowColor='#ff2050'; ctx.shadowBlur=25;
  ctx.fillText('GAME OVER',LARGURA/2,ALTURA*0.20);

  ctx.shadowColor='#00f5ff';
  ctx.fillStyle='#fff';
  ctx.font=`bold ${28*ESCALA}px ui-monospace, monospace`;
  ctx.fillText(String(estado.pontos).padStart(5,'0'),LARGURA/2,ALTURA*0.34);

  ctx.shadowBlur=0;
  ctx.fillStyle='#ffcc00';
  ctx.font=`bold ${14*ESCALA}px ui-monospace, monospace`;
  ctx.fillText('◆ MOEDAS: '+estado.moedasRun,LARGURA/2,ALTURA*0.42);

  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.font=`bold ${14*ESCALA}px ui-monospace, monospace`;
  const txt=isBossPhase()?'CHEFE':(FASES[estado.faseIdx].nome+' · FASE '+(estado.faseIdx+1));
  ctx.fillText(txt+(estado.ciclo>0?' · CICLO '+(estado.ciclo+1):''),LARGURA/2,ALTURA*0.50);

  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.font=`bold ${12*ESCALA}px ui-monospace, monospace`;
  ctx.fillText('RECORDE: '+recorde,LARGURA/2,ALTURA*0.57);

  if(estado.tempoFim>30){
    const a=0.5+0.5*Math.sin(estado.frame*0.1);
    ctx.globalAlpha=a;
    ctx.fillStyle='#00f5ff';
    ctx.shadowColor='#00f5ff';
    ctx.shadowBlur=15;
    ctx.font=`bold ${16*ESCALA}px ui-monospace, monospace`;
    ctx.fillText(isTouch?'TOQUE PARA REINICIAR':'ESPAÇO / CLIQUE PARA REINICIAR',LARGURA/2,ALTURA*0.72);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* ══════════ CLIMA / NOITE ══════════ */
function desenharOverlayNoite(){
  if(estado.tela!=='jogando'||isBossPhase()) return;
  const prog=clamp(estado.faseTempo/FASE_DURACAO,0,1);
  if(prog<0.6) return;
  const a=(prog-0.6)/0.4*0.25;
  ctx.save();
  ctx.fillStyle=`rgba(5,1,15,${a})`;
  ctx.fillRect(0,0,LARGURA,ALTURA);
  ctx.restore();
}

/* ══════════ DESENHO PRINCIPAL ══════════ */
function desenhar(){
  ctx.save();
  if(estado.shake>0){
    const s=estado.shake;
    ctx.translate(rand(-s,s),rand(-s,s));
  }

  desenharFundoSynth();
  desenharChaoSynth();

  if(isBossPhase()) desenharBoss();

  for(const o of obstaculos) desenharObstaculo(o);
  for(const d of drones) desenharDrone(d);
  for(const m of moedas) desenharMoeda(m);
  for(const p of powerUps) desenharPowerUp(p);

  desenharJogador();

  for(const p of particulas){
    ctx.globalAlpha=p.vida/p.vidaMax;
    ctx.fillStyle=p.cor;
    ctx.shadowColor=p.cor;
    ctx.shadowBlur=8;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.tam*(p.vida/p.vidaMax),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  desenharOverlayNoite();
  ctx.restore();

  desenharVinheta();
  desenharHUD();
  desenharBanner();
  desenharBotoes();

  if(estado.tela==='menu') desenharMenu();
  else if(estado.tela==='fim') desenharFim();
}

/* ══════════ LOOP ══════════ */
let ultimoTempo=performance.now();
function loop(agora){
  let dt=(agora-ultimoTempo)/(1000/60);
  ultimoTempo=agora;
  if(!isFinite(dt)||dt<0) dt=1;
  dt=Math.min(dt,3);
  atualizar(dt);
  desenhar();
  requestAnimationFrame(loop);
}

/* ══════════ CONTROLES: TECLADO ══════════ */
window.addEventListener('keydown',(e)=>{
  if(['Space','ArrowUp','KeyW','ArrowDown','KeyS','KeyX','ShiftLeft','ShiftRight'].includes(e.code)){
    e.preventDefault();
  }
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){if(!e.repeat)pular();}
  if(e.code==='ArrowDown'||e.code==='KeyS') agachar(true);
  if((e.code==='KeyX'||e.code==='ShiftLeft'||e.code==='ShiftRight')&&!e.repeat) dash();
  if(estado.tela==='menu'&&/^Digit[1-5]$/.test(e.code)){
    const n=parseInt(e.code.slice(-1))-1;
    if(n<SKINS.length){
      if(skinsDesbloq.includes(n)){skinAtual=n;salvar();}
      else if(SKINS[n].preco<=moedasTotais){
        moedasTotais-=SKINS[n].preco; skinsDesbloq.push(n);
        skinAtual=n; salvar(); SFX.power();
      }
    }
  }
},{passive:false});
window.addEventListener('keyup',(e)=>{
  if(e.code==='ArrowDown'||e.code==='KeyS') agachar(false);
});

/* ══════════ CONTROLES: TOQUE ══════════ */
const toques=new Map();
canvas.addEventListener('touchstart',(e)=>{
  e.preventDefault(); initAudio(); acordarBotoes();
  for(const t of e.changedTouches){
    const rect=canvas.getBoundingClientRect();
    const x=(t.clientX-rect.left)/rect.width*LARGURA;
    const y=(t.clientY-rect.top)/rect.height*ALTURA;

    /* clique em skin no menu */
    if(estado.tela==='menu'){
      const sW=Math.min(90*ESCALA,LARGURA*0.095);
      const sH=50*ESCALA;
      const sGap=Math.min(8*ESCALA,LARGURA*0.006);
      const sTot=SKINS.length*sW+(SKINS.length-1)*sGap;
      const sX0=(LARGURA-sTot)/2;
      const sY=ALTURA*0.65;
      if(y>=sY&&y<=sY+sH){
        for(let i=0;i<SKINS.length;i++){
          const sx=sX0+i*(sW+sGap);
          if(x>=sx&&x<=sx+sW){
            if(skinsDesbloq.includes(i)){skinAtual=i;salvar();}
            else if(SKINS[i].preco<=moedasTotais){
              moedasTotais-=SKINS[i].preco; skinsDesbloq.push(i);
              skinAtual=i; salvar(); SFX.power();
            }
            break;
          }
        }
        continue;
      }
    }

    const btn=pontoEmBotao(x,y);
    if(btn){
      btn.ativo=true;
      toques.set(t.identifier,btn.tipo);
      if(btn.tipo==='pulo') pular();
      else if(btn.tipo==='dash') dash();
      else if(btn.tipo==='agacha') agachar(true);
    } else {
      if(estado.tela==='menu'||estado.tela==='fim'||estado.tela==='jogando') pular();
    }
  }
},{passive:false});
canvas.addEventListener('touchmove',(e)=>{e.preventDefault();acordarBotoes();},{passive:false});
canvas.addEventListener('touchend',(e)=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const tipo=toques.get(t.identifier);
    if(tipo==='agacha'){agachar(false);botoes.agacha.ativo=false;}
    if(tipo==='pulo') botoes.pulo.ativo=false;
    if(tipo==='dash') botoes.dash.ativo=false;
    toques.delete(t.identifier);
  }
},{passive:false});
canvas.addEventListener('touchcancel',(e)=>{
  for(const t of e.changedTouches){
    const tipo=toques.get(t.identifier);
    if(tipo==='agacha') agachar(false);
    toques.delete(t.identifier);
  }
  botoes.pulo.ativo=botoes.dash.ativo=botoes.agacha.ativo=false;
});

/* ══════════ CONTROLES: MOUSE ══════════ */
let mouseHoldTimer=null, mouseHoldCrouch=false;
canvas.addEventListener('mousedown',(e)=>{
  e.preventDefault(); initAudio();
  if(e.button===2){dash();return;}

  if(estado.tela==='menu'){
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width*LARGURA;
    const y=(e.clientY-rect.top)/rect.height*ALTURA;
    const sW=Math.min(90*ESCALA,LARGURA*0.095);
    const sH=50*ESCALA;
    const sGap=Math.min(8*ESCALA,LARGURA*0.006);
    const sTot=SKINS.length*sW+(SKINS.length-1)*sGap;
    const sX0=(LARGURA-sTot)/2;
    const sY=ALTURA*0.65;
    if(y>=sY&&y<=sY+sH){
      for(let i=0;i<SKINS.length;i++){
        const sx=sX0+i*(sW+sGap);
        if(x>=sx&&x<=sx+sW){
          if(skinsDesbloq.includes(i)){skinAtual=i;salvar();}
          else if(SKINS[i].preco<=moedasTotais){
            moedasTotais-=SKINS[i].preco; skinsDesbloq.push(i);
            skinAtual=i; salvar(); SFX.power();
          }
          return;
        }
      }
    }
    pular(); return;
  }

  mouseHoldCrouch=false;
  mouseHoldTimer=setTimeout(()=>{mouseHoldCrouch=true;agachar(true);},200);
});
canvas.addEventListener('mouseup',(e)=>{
  if(e.button!==0) return;
  if(mouseHoldTimer){clearTimeout(mouseHoldTimer);mouseHoldTimer=null;}
  if(mouseHoldCrouch){agachar(false);mouseHoldCrouch=false;}
  else pular();
});
canvas.addEventListener('mouseleave',()=>{
  if(mouseHoldTimer){clearTimeout(mouseHoldTimer);mouseHoldTimer=null;}
  if(mouseHoldCrouch){agachar(false);mouseHoldCrouch=false;}
});
canvas.addEventListener('contextmenu',(e)=>e.preventDefault());

/* ══════════ INICIAR ══════════ */
redimensionar();
setTimeout(redimensionar,100);
setTimeout(redimensionar,400);
resetJogador();
requestAnimationFrame(loop);

})();
</script>
</body>
