<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Pula Oficina — Deluxe</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(circle at 50% 0%,#22303f,#10161d 70%);display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  canvas{display:block;width:min(96vw,900px);aspect-ratio:900/420;height:auto;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.6);cursor:pointer;touch-action:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="jogo"></canvas>
<script>
(() => {
'use strict';

/* ══════════ CONFIG ══════════ */
const LARGURA=900, ALTURA=420, CHAO_Y=ALTURA-70;
const GRAVIDADE=0.9, FORCA_PULO=-16.5;
const VEL_INICIAL=6, VEL_MAXIMA=17;
const FASE_DURACAO=22, FASE_INTRO=2.5, FASE_OUTRO=2.2;

const DASH_DUR=0.35, DASH_CD=1.6;
const INVULN_TEMPO=1.8, VIDA_MAX=3;
const COMBO_JANELA=1.6;

/* ══════════ FASES ══════════ */
const FASES=[
  {nome:'Oficina Mecânica',clima:'clear',ceu:['#395a6b','#7fa8bb','#c8dde6'],nuvem:'rgba(255,255,255,0.85)',colinasA:'#3d5a64',colinasB:'#5a7a86',chaoTopo:'#9aa5aa',chao:['#5a6068','#3a4048','#1e2228'],obstaculos:['pneu','macaco','caixa'],decor:'pipes'},
  {nome:'Serralheria',clima:'rain',ceu:['#5a1a10','#b8502a','#f0b478'],nuvem:'rgba(255,200,150,0.5)',colinasA:'#3a1a10',colinasB:'#5a2a18',chaoTopo:'#a05a30',chao:['#4a2818','#2e160e','#180a04'],obstaculos:['bigorna','engrenagem','barra'],decor:'sparks'},
  {nome:'Depósito de Peças',clima:'clear',ceu:['#1e4a3e','#4a9a7a','#b8e0cc'],nuvem:'rgba(220,255,240,0.75)',colinasA:'#1a3a30',colinasB:'#2e5a4a',chaoTopo:'#c8b090',chao:['#7a6040','#4a3a28','#2a2018'],obstaculos:['engradado','lata','balde'],decor:'boxes'},
  {nome:'Funilaria',clima:'rain',ceu:['#2a1a4a','#6a4a8a','#c8a8d8'],nuvem:'rgba(220,200,255,0.65)',colinasA:'#25183a',colinasB:'#3e2a58',chaoTopo:'#8a6aa0',chao:['#4a3058','#2e1e38','#18101e'],obstaculos:['portaCarro','extintor','lataTinta'],decor:'spray'},
  {nome:'Marcenaria',clima:'snow',ceu:['#4a2a10','#a06a30','#e8c890'],nuvem:'rgba(255,220,180,0.55)',colinasA:'#3a2010',colinasB:'#5a3818',chaoTopo:'#c09050',chao:['#7a5028','#4a3018','#2a1a0c'],obstaculos:['tabua','serra','martelo'],decor:'serragem'},
  {nome:'Eletrônica',clima:'clear',ceu:['#0a1a3a','#1a4a7a','#5aa8d8'],nuvem:'rgba(180,230,255,0.55)',colinasA:'#0a1830',colinasB:'#153050',chaoTopo:'#3a6080',chao:['#1a3048','#0e1e2e','#060e18'],obstaculos:['capacitor','chip','bobina'],decor:'circuit'}
];

/* ══════════ TIPOS ══════════ */
const TIPOS_OBSTACULO={
  pneu:{largura:46,altura:46},macaco:{largura:42,altura:60},caixa:{largura:54,altura:42},
  bigorna:{largura:66,altura:52},engrenagem:{largura:56,altura:56},barra:{largura:28,altura:72},
  engradado:{largura:52,altura:52},lata:{largura:38,altura:56},balde:{largura:46,altura:48},
  portaCarro:{largura:62,altura:46},extintor:{largura:32,altura:64},lataTinta:{largura:42,altura:54},
  tabua:{largura:72,altura:24},serra:{largura:58,altura:46},martelo:{largura:48,altura:56},
  capacitor:{largura:36,altura:58},chip:{largura:54,altura:42},bobina:{largura:46,altura:52},
  projetilBoss:{largura:44,altura:44}
};

/* ══════════ SKINS ══════════ */
const SKINS=[
  {nome:'Clássico',corpo:['#ff9a6b','#ff5f6d'],pernas:'#2f3e57',olho:'#22303f',preco:0},
  {nome:'Azul',corpo:['#6bb8ff','#3b82f6'],pernas:'#1e3a5f',olho:'#0a1a3f',preco:300},
  {nome:'Verde',corpo:['#6bffa0','#22c55e'],pernas:'#1a3a20',olho:'#0a2a12',preco:600},
  {nome:'Dourado',corpo:['#ffe066','#f59e0b'],pernas:'#4a2a10',olho:'#2a1a08',preco:1200},
  {nome:'Fantasma',corpo:['#e0e0ff','#a5b4fc'],pernas:'#4a4a6a',olho:'#1a1a3a',preco:2500}
];

/* ══════════ CANVAS ══════════ */
const canvas=document.getElementById('jogo');
const ctx=canvas.getContext('2d');
canvas.width=LARGURA; canvas.height=ALTURA;

/* ══════════ UTILS ══════════ */
const rand=(a,b)=>Math.random()*(b-a)+a;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function arredondado(x,y,w,h,r){
  r=Math.min(r,Math.abs(w)/2,Math.abs(h)/2);
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function colide(a,b){
  return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

/* ══════════ AUDIO ══════════ */
let audioCtx=null;
function initAudio(){
  if(audioCtx) return;
  try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function beep(f,d,t='square',v=0.06){
  if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=t; o.frequency.value=f; g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
function sweep(f1,f2,d,t='sawtooth',v=0.06){
  if(!audioCtx) return;
  try{
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=t;
    o.frequency.setValueAtTime(f1,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(f2,audioCtx.currentTime+d);
    g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+d);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+d);
  }catch(e){}
}
const SFX={
  pulo:()=>sweep(420,720,0.15),
  pulo2:()=>sweep(520,880,0.15),
  moeda:()=>{beep(1200,0.08,'square',0.05);setTimeout(()=>beep(1600,0.08,'square',0.05),50);},
  dano:()=>sweep(280,90,0.3,'sawtooth',0.1),
  power:()=>{beep(700,0.1,'triangle',0.08);setTimeout(()=>beep(1100,0.15,'triangle',0.08),80);},
  dash:()=>sweep(600,1400,0.15,'sine',0.06),
  morte:()=>{sweep(400,80,0.6,'sawtooth',0.1);},
  fase:()=>{beep(700,0.15,'triangle',0.08);setTimeout(()=>beep(1050,0.15,'triangle',0.08),120);setTimeout(()=>beep(1400,0.25,'triangle',0.08),240);},
  boss:()=>{sweep(200,90,0.5,'sawtooth',0.1);setTimeout(()=>sweep(180,70,0.6,'sawtooth',0.1),250);}
};

/* ══════════ SAVE/LOAD ══════════ */
let recorde=0, moedasTotais=0, skinsDesbloq=[0], skinAtual=0;
try{
  recorde=parseInt(localStorage.getItem('po.recorde'),10)||0;
  moedasTotais=parseInt(localStorage.getItem('po.moedas'),10)||0;
  const sd=localStorage.getItem('po.skins');
  if(sd) skinsDesbloq=JSON.parse(sd);
  skinAtual=parseInt(localStorage.getItem('po.skin'),10)||0;
  if(!skinsDesbloq.includes(skinAtual)) skinAtual=0;
}catch(e){}
function salvar(){
  try{
    localStorage.setItem('po.recorde',recorde);
    localStorage.setItem('po.moedas',moedasTotais);
    localStorage.setItem('po.skins',JSON.stringify(skinsDesbloq));
    localStorage.setItem('po.skin',skinAtual);
  }catch(e){}
}

/* ══════════ ESTADO ══════════ */
const estado={
  tela:'menu', faseIdx:0, ciclo:0, faseTempo:0,
  aviso:0, concluindo:0, velocidade:VEL_INICIAL,
  distancia:0, pontos:0, pontosFaseInicio:0,
  tempoFim:0, frame:0, deslocChao:0,
  colinasA:0, colinasB:0, decorDesloc:0,
  shake:0, powerUps:{escudo:0,ima:0,lento:0,inv:0,super:0},
  proxPowerUp:6, proxMoeda:4, proxDrone:8,
  estrelas:0, moedasRun:0, combo:0, comboTempo:0
};

const jogador={
  x:110, largura:38, alturaBase:46, alturaAgachado:26, alturaAtual:46,
  y:CHAO_Y, vy:0, saltos:0, maxSaltosBase:2,
  noChao:true, agachando:false,
  dashTempo:0, dashCd:0, invuln:0,
  vidas:VIDA_MAX, rastro:[]
};

let obstaculos=[], powerUps=[], moedas=[], particulas=[], drones=[], climaP=[];
let proximoObstaculo=450;

const boss={ativo:false,hp:8,maxHp:8,cooldown:2,entrada:0,hitFlash:0};

const nuvens=Array.from({length:6},()=>({x:rand(0,LARGURA),y:rand(25,175),escala:rand(.6,1.3),vel:rand(.15,.45)}));

/* ══════════ CLIMA ══════════ */
function initClima(tipo){
  climaP.length=0;
  const n=tipo==='rain'?90:tipo==='snow'?55:0;
  for(let i=0;i<n;i++){
    climaP.push({
      x:Math.random()*LARGURA, y:Math.random()*ALTURA,
      vx:tipo==='rain'?-4:-0.7,
      vy:tipo==='rain'?9:1.1,
      t:tipo,
      tam:tipo==='rain'?1.6:2.5,
      fase:Math.random()*Math.PI*2
    });
  }
}

/* ══════════ PARTÍCULAS ══════════ */
function addP(x,y,cor,vx,vy,vida,tam){
  particulas.push({x,y,cor,vx,vy,vida,vidaMax:vida,tam:tam||3});
}

/* ══════════ LÓGICA DE FASE ══════════ */
const isBossPhase=()=>estado.faseIdx>=FASES.length;
const faseAtual=()=>FASES[estado.faseIdx%FASES.length];

function iniciarFase(idx){
  estado.faseIdx=idx;
  estado.faseTempo=0;
  estado.aviso=FASE_INTRO;
  estado.concluindo=0;
  obstaculos=[]; powerUps=[]; moedas=[]; drones=[];
  proximoObstaculo=450;
  estado.proxPowerUp=rand(6,12);
  estado.proxMoeda=rand(3,6);
  estado.proxDrone=rand(6,12);
  estado.pontosFaseInicio=estado.pontos;
  estado.moedasRun=0;
  estado.combo=0;

  if(idx>=FASES.length){
    boss.ativo=true; boss.hp=boss.maxHp; boss.cooldown=2.5; boss.entrada=0; boss.hitFlash=0;
    initClima('rain');
    SFX.boss();
  }else{
    boss.ativo=false;
    initClima(FASES[idx].clima);
    SFX.fase();
  }
}

function iniciarJogo(){
  estado.tela='jogando';
  estado.ciclo=0; estado.distancia=0; estado.pontos=0;
  estado.tempoFim=0; estado.velocidade=VEL_INICIAL;
  estado.powerUps={escudo:0,ima:0,lento:0,inv:0,super:0};
  jogador.y=CHAO_Y; jogador.vy=0; jogador.saltos=0; jogador.noChao=true;
  jogador.vidas=VIDA_MAX; jogador.invuln=0; jogador.dashTempo=0; jogador.dashCd=0;
  jogador.agachando=false; jogador.alturaAtual=jogador.alturaBase;
  jogador.rastro=[];
  particulas=[];
  iniciarFase(0);
  salvar();
}

/* ══════════ AÇÕES DO JOGADOR ══════════ */
function pular(){
  if(estado.tela==='menu'){initAudio();iniciarJogo();return;}
  if(estado.tela==='fim'){ if(estado.tempoFim>30){initAudio();iniciarJogo();} return; }
  const maxS=jogador.maxSaltosBase+(estado.powerUps.super>0?1:0);
  if(jogador.saltos<maxS){
    jogador.vy=jogador.saltos===0?FORCA_PULO:FORCA_PULO*.85;
    jogador.saltos++;
    jogador.noChao=false;
    jogador.saltos===1?SFX.pulo():SFX.pulo2();
    for(let i=0;i<6;i++){
      addP(jogador.x+jogador.largura/2, jogador.y, 'rgba(200,200,200,0.9)',
        rand(-2,2), rand(-1,0.5), 0.4, rand(2,4));
    }
  }
}

function agachar(ativo){
  if(estado.tela!=='jogando') return;
  jogador.agachando=ativo;
}

function dash(){
  if(estado.tela!=='jogando') return;
  if(jogador.dashCd>0||!jogador.noChao) return;
  jogador.dashTempo=DASH_DUR;
  jogador.dashCd=DASH_CD;
  jogador.invuln=Math.max(jogador.invuln,DASH_DUR);
  SFX.dash();
  for(let i=0;i<12;i++){
    addP(jogador.x, jogador.y-jogador.alturaAtual/2, 'rgba(150,220,255,0.9)',
      rand(-8,-3), rand(-2,2), 0.4, rand(2,4));
  }
}

function criarObstaculo(){
  const fase=faseAtual();
  const nome=fase.obstaculos[Math.floor(Math.random()*fase.obstaculos.length)];
  const def=TIPOS_OBSTACULO[nome];
  const tipo=[nome];
  // 20% chance de ser obstáculo móvel (sobe/desce)
  const movel=Math.random()<0.2 && estado.faseTempo>6;
  obstaculos.push({
    x:LARGURA+40, y:CHAO_Y-def.altura,
    baseY:CHAO_Y-def.altura,
    largura:def.largura, altura:def.altura,
    tipo:nome, movel, movBob:rand(0,Math.PI*2),
    movAmp:movel?rand(8,18):0
  });
}

function criarMoeda(){
  moedas.push({
    x:LARGURA+40, y:CHAO_Y-rand(60,150),
    largura:22, altura:22, bob:rand(0,Math.PI*2), rot:0
  });
}

function criarPowerUp(){
  const tipos=['escudo','ima','lento','inv','super'];
  const t=tipos[Math.floor(Math.random()*tipos.length)];
  powerUps.push({
    x:LARGURA+40, y:CHAO_Y-rand(90,140),
    largura:40, altura:40, tipo:t, bob:rand(0,Math.PI*2)
  });
}

function criarDrone(){
  const tipos=[
    {y:CHAO_Y-35, altura:26},   // baixo (pular)
    {y:CHAO_Y-95, altura:26},   // médio-alto (agachar por baixo)
    {y:CHAO_Y-130, altura:26}   // alto
  ];
  const t=tipos[Math.floor(Math.random()*tipos.length)];
  drones.push({
    x:LARGURA+40, y:t.y, baseY:t.y,
    largura:52, altura:t.altura,
    bob:rand(0,Math.PI*2), helic:0
  });
}

function criarProjetilBoss(){
  obstaculos.push({
    x:LARGURA-260, y:CHAO_Y-90, baseY:CHAO_Y-90,
    largura:44, altura:44, tipo:'projetilBoss',
    contado:false, rotacao:0, vy:0, movel:false
  });
}

function perderVida(){
  if(jogador.invuln>0) return;
  jogador.vidas--;
  jogador.invuln=INVULN_TEMPO;
  estado.shake=14;
  SFX.dano();
  for(let i=0;i<20;i++){
    addP(jogador.x+jogador.largura/2, jogador.y-jogador.alturaAtual/2,
      i%2?'#ff5050':'#ffaa00', rand(-5,5), rand(-6,1), 0.7, rand(2,5));
  }
  if(jogador.vidas<=0) finalizarJogo();
}

function finalizarJogo(){
  estado.tela='fim';
  estado.tempoFim=0;
  if(estado.pontos>recorde){recorde=estado.pontos;salvar();}
  moedasTotais+=estado.moedasRun;
  salvar();
  SFX.morte();
}

/* ══════════ ATUALIZAR ══════════ */
function atualizar(dt){
  estado.frame+=dt;

  /* velocidade de fundo */
  let velFundo;
  if(estado.tela==='jogando'&&!estado.aviso&&!estado.concluindo) velFundo=estado.velocidade;
  else if(estado.tela==='jogando') velFundo=4;
  else velFundo=2.5;

  /* câmera lenta global */
  const fatorLento=estado.powerUps.lento>0?0.55:1;

  estado.colinasA=(estado.colinasA+velFundo*0.12*dt)%10000;
  estado.colinasB=(estado.colinasB+velFundo*0.30*dt)%10000;
  estado.decorDesloc+=velFundo*dt;

  for(const n of nuvens){
    n.x-=(n.vel+velFundo*0.05)*dt;
    if(n.x<-160){n.x=LARGURA+rand(20,250);n.y=rand(25,175);n.escala=rand(.6,1.3);}
  }

  /* partículas */
  for(let i=particulas.length-1;i>=0;i--){
    const p=particulas[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.vy+=0.25*dt;
    p.vida-=dt/60;
    if(p.vida<=0) particulas.splice(i,1);
  }

  /* clima */
  for(const c of climaP){
    c.x+=c.vx*dt*fatorLento;
    c.y+=c.vy*dt*fatorLento;
    if(c.t==='snow') c.x+=Math.sin(estado.frame*0.03+c.fase)*0.5*dt;
    if(c.y>ALTURA){c.y=-10;c.x=Math.random()*LARGURA;}
    if(c.x<-20){c.x=LARGURA+10;}
  }

  /* shake */
  if(estado.shake>0) estado.shake=Math.max(0,estado.shake-dt*0.6);

  /* física do jogador */
  if(jogador.dashCd>0) jogador.dashCd-=dt/60;
  if(jogador.dashTempo>0) jogador.dashTempo-=dt/60;
  if(jogador.invuln>0) jogador.invuln-=dt/60;

  /* altura de agachar (lerp) */
  const alvoAlt=jogador.agachando&&jogador.noChao?jogador.alturaAgachado:jogador.alturaBase;
  jogador.alturaAtual+=(alvoAlt-jogador.alturaAtual)*0.3*dt;

  jogador.vy+=GRAVIDADE*dt;
  jogador.y+=jogador.vy*dt;
  if(jogador.y>=CHAO_Y){
    if(!jogador.noChao){
      /* pouso */
      for(let i=0;i<5;i++){
        addP(jogador.x+jogador.largura/2,CHAO_Y,'rgba(180,180,180,0.7)',
          rand(-3,3),rand(-2,0),0.3,rand(2,3));
      }
    }
    jogador.y=CHAO_Y; jogador.vy=0; jogador.saltos=0; jogador.noChao=true;
  } else jogador.noChao=false;

  /* rastro */
  if(estado.tela==='jogando'&&!estado.aviso&&!estado.concluindo){
    jogador.rastro.push({x:jogador.x+jogador.largura/2,y:jogador.y-jogador.alturaAtual/2,vida:0.4});
    if(jogador.rastro.length>14) jogador.rastro.shift();
  }
  for(let i=jogador.rastro.length-1;i>=0;i--){
    jogador.rastro[i].vida-=dt/60;
    if(jogador.rastro[i].vida<=0) jogador.rastro.splice(i,1);
  }

  if(estado.tela==='fim'){ estado.tempoFim+=dt; return; }
  if(estado.tela!=='jogando') return;

  /* power-up timers */
  for(const k in estado.powerUps){
    if(estado.powerUps[k]>0) estado.powerUps[k]=Math.max(0,estado.powerUps[k]-dt/60);
  }

  /* combo timer */
  if(estado.comboTempo>0){
    estado.comboTempo-=dt/60;
    if(estado.comboTempo<=0) estado.combo=0;
  }

  /* banner de início */
  if(estado.aviso>0){
    estado.aviso-=dt/60;
    if(boss.ativo) boss.entrada=Math.min(1,boss.entrada+dt/60/FASE_INTRO);
    return;
  }

  /* banner de conclusão */
  if(estado.concluindo>0){
    estado.concluindo-=dt/60;
    if(estado.concluindo<=0){
      let prox=estado.faseIdx+1;
      if(prox>FASES.length){prox=0;estado.ciclo++;}
      iniciarFase(prox);
    }
    return;
  }

  /* ─── GAMEPLAY ─── */
  const velBase=VEL_INICIAL+estado.faseIdx*1.2+estado.ciclo*2.5;
  estado.velocidade=Math.min(VEL_MAXIMA,velBase+estado.faseTempo*0.10);
  const velEfetiva=estado.velocidade*fatorLento;

  estado.distancia+=velEfetiva*dt;
  const mult=(estado.powerUps.ima>0?2:1)*(1+estado.combo*0.5);
  estado.pontos=Math.floor(estado.distancia/20)*mult;
  estado.deslocChao=(estado.deslocChao+velEfetiva*dt)%80;

  /* ─── BOSS ─── */
  if(boss.ativo){
    boss.entrada=Math.min(1,boss.entrada+dt/60/1.5);
    if(boss.hitFlash>0) boss.hitFlash-=dt/60;
    boss.cooldown-=dt/60;
    if(boss.cooldown<=0){ criarProjetilBoss(); boss.cooldown=rand(1.4,1.9); }
  } else {
    /* ─── FASES NORMAIS ─── */
    estado.faseTempo+=dt/60;
    if(estado.faseTempo>=FASE_DURACAO){
      estado.concluindo=FASE_OUTRO;
      /* estrelas: 1 base + 1 se 2+ vidas + 1 se 3 vidas */
      estado.estrelas=jogador.vidas>=3?3:jogador.vidas>=2?2:1;
      obstaculos=[];
      return;
    }
  }

  /* ─── SPAWN OBSTÁCULOS ─── */
  proximoObstaculo-=velEfetiva*dt;
  if(proximoObstaculo<=0){
    criarObstaculo();
    proximoObstaculo=rand(250,430)*(estado.velocidade/VEL_INICIAL);
  }

  /* ─── SPAWN MOEDAS ─── */
  estado.proxMoeda-=dt/60;
  if(estado.proxMoeda<=0){
    criarMoeda();
    estado.proxMoeda=rand(2.5,5);
  }

  /* ─── SPAWN POWER-UP ─── */
  estado.proxPowerUp-=dt/60;
  if(estado.proxPowerUp<=0){
    criarPowerUp();
    estado.proxPowerUp=rand(9,16);
  }

  /* ─── SPAWN DRONES ─── */
  if(estado.faseIdx>=1){
    estado.proxDrone-=dt/60;
    if(estado.proxDrone<=0){
      criarDrone();
      estado.proxDrone=rand(5,10);
    }
  }

  /* ─── MOVER OBSTÁCULOS ─── */
  for(const o of obstaculos){
    o.x-=velEfetiva*dt*(o.tipo==='projetilBoss'?1.15:1);
    if(o.movel){
      o.movBob+=dt*0.05;
      o.y=o.baseY+Math.sin(o.movBob)*o.movAmp;
    }
    if(o.tipo==='projetilBoss'){
      o.rotacao+=0.15*dt;
      if(o.y+o.altura<CHAO_Y) o.vy+=GRAVIDADE*0.25*dt;
      o.y+=o.vy*dt;
      if(o.y+o.altura>CHAO_Y){o.y=CHAO_Y-o.altura;o.vy=0;}
    }
  }
  obstaculos=obstaculos.filter(o=>o.x+o.largura>-60);

  /* contar projéteis do boss que passaram */
  for(const o of obstaculos){
    if(o.tipo==='projetilBoss'&&!o.contado&&o.x+o.largura<jogador.x){
      o.contado=true;
      boss.hp--;
      boss.hitFlash=0.3;
      estado.shake=8;
      for(let i=0;i<10;i++){
        addP(o.x+o.largura/2,o.y+o.altura/2,'#ffcc00',
          rand(-4,4),rand(-4,4),0.5,rand(2,4));
      }
    }
  }
  if(boss.ativo&&boss.hp<=0){
    estado.concluindo=FASE_OUTRO;
    estado.estrelas=3;
    obstaculos=[];
    boss.ativo=false;
    estado.shake=18;
    SFX.fase();
    return;
  }

  /* ─── MOVER MOEDAS ─── */
  for(const m of moedas){ m.x-=velEfetiva*dt; m.bob+=dt*0.1; m.rot+=dt*0.1; }
  moedas=moedas.filter(m=>m.x+m.largura>-40);

  /* ─── MOVER POWER-UPS ─── */
  for(const p of powerUps){ p.x-=velEfetiva*dt; p.bob+=dt*0.1; }
  powerUps=powerUps.filter(p=>p.x+p.largura>-40);

  /* ─── MOVER DRONES ─── */
  for(const d of drones){
    d.x-=velEfetiva*dt*1.05;
    d.bob+=dt*0.08;
    d.helic+=dt*0.5;
    d.y=d.baseY+Math.sin(d.bob)*6;
  }
  drones=drones.filter(d=>d.x+d.largura>-40);

  /* ─── COLISÃO ─── */
  const hb={
    x:jogador.x+6,
    y:jogador.y-jogador.alturaAtual+5,
    w:jogador.largura-12,
    h:jogador.alturaAtual-8
  };

  /* moedas */
  for(let i=moedas.length-1;i>=0;i--){
    const m=moedas[i];
    const hm={x:m.x+3,y:m.y+3,w:m.largura-6,h:m.altura-6};
    if(colide(hb,hm)){
      estado.pontos+=10;
      estado.moedasRun++;
      moedas.splice(i,1);
      SFX.moeda();
      for(let k=0;k<8;k++){
        addP(m.x+m.largura/2,m.y+m.altura/2,'#ffdd44',
          rand(-3,3),rand(-3,1),0.5,rand(2,4));
      }
    }
  }

  /* power-ups */
  for(let i=powerUps.length-1;i>=0;i--){
    const p=powerUps[i];
    const hp={x:p.x+4,y:p.y+4,w:p.largura-8,h:p.altura-8};
    if(colide(hb,hp)){
      const dur={escudo:5,ima:8,lento:5,inv:5,super:8}[p.tipo];
      estado.powerUps[p.tipo]=dur;
      powerUps.splice(i,1);
      SFX.power();
      for(let k=0;k<15;k++){
        addP(p.x+p.largura/2,p.y+p.altura/2,'#a855f7',
          rand(-5,5),rand(-5,5),0.7,rand(2,5));
      }
    }
  }

  /* obstáculos (invisível passa por tudo) */
  const invulnAll=estado.powerUps.inv>0;
  const escudoAtivo=estado.powerUps.escudo>0||jogador.dashTempo>0||jogador.invuln>0;

  for(let i=obstaculos.length-1;i>=0;i--){
    const o=obstaculos[i];
    const ho={x:o.x+4,y:o.y+4,w:o.largura-8,h:o.altura-4};
    if(colide(hb,ho)){
      if(invulnAll){
        obstaculos.splice(i,1);
        continue;
      }
      if(escudoAtivo){
        obstaculos.splice(i,1);
        for(let k=0;k<12;k++){
          addP(o.x+o.largura/2,o.y+o.altura/2,'#ffcc00',
            rand(-5,5),rand(-5,2),0.5,rand(2,5));
        }
        continue;
      }
      perderVida();
      if(estado.tela==='fim') return;
      /* remove para evitar múltiplos hits */
      obstaculos.splice(i,1);
      break;
    }
  }

  /* drones */
  for(let i=drones.length-1;i>=0;i--){
    const d=drones[i];
    const hd={x:d.x+5,y:d.y+4,w:d.largura-10,h:d.altura-8};
    if(colide(hb,hd)){
      if(invulnAll){ drones.splice(i,1); continue; }
      if(escudoAtivo){
        drones.splice(i,1);
        for(let k=0;k<12;k++){
          addP(d.x+d.largura/2,d.y+d.altura/2,'#88ddff',
            rand(-5,5),rand(-5,2),0.5,rand(2,5));
        }
        continue;
      }
      perderVida();
      if(estado.tela==='fim') return;
      drones.splice(i,1);
      break;
    }
  }
}

/* ══════════ CENÁRIO ══════════ */
function desenharCeu(fase){
  const g=ctx.createLinearGradient(0,0,0,CHAO_Y);
  g.addColorStop(0,fase.ceu[0]); g.addColorStop(0.55,fase.ceu[1]); g.addColorStop(1,fase.ceu[2]);
  ctx.fillStyle=g; ctx.fillRect(0,0,LARGURA,ALTURA);

  /* sol/lua */
  const prog=estado.tela==='jogando'?clamp(estado.faseTempo/FASE_DURACAO,0,1):0;
  const noturno=prog>0.65;
  const corSol=noturno
    ? ['rgba(220,220,255,0.9)','rgba(180,190,220,0.4)','rgba(180,190,220,0)']
    : ['rgba(255,248,200,1)','rgba(255,236,150,0.7)','rgba(255,236,150,0)'];
  const gSol=ctx.createRadialGradient(LARGURA-130,85,10,LARGURA-130,85,110);
  gSol.addColorStop(0,corSol[0]); gSol.addColorStop(0.45,corSol[1]); gSol.addColorStop(1,corSol[2]);
  ctx.fillStyle=gSol;
  ctx.beginPath(); ctx.arc(LARGURA-130,85,noturno?20:60,0,Math.PI*2); ctx.fill();
}

function desenharNuvem(n,fase){
  ctx.save(); ctx.translate(n.x,n.y); ctx.scale(n.escala,n.escala);
  ctx.fillStyle=fase.nuvem;
  ctx.beginPath();
  ctx.arc(0,0,26,0,Math.PI*2); ctx.arc(28,6,20,0,Math.PI*2);
  ctx.arc(-28,8,18,0,Math.PI*2); ctx.arc(4,14,22,0,Math.PI*2);
  ctx.fill(); ctx.restore();
}

function desenharCamadaColinas(desloc,passo,raioBase,baseY){
  const d=((desloc%passo)+passo)%passo;
  const n=Math.ceil(LARGURA/passo)+3;
  ctx.beginPath();
  for(let i=-1;i<n;i++){
    const cx=i*passo+d;
    const r=raioBase*(0.75+0.35*Math.abs(Math.sin(i*1.7)));
    ctx.moveTo(cx-r,baseY); ctx.arc(cx,baseY,r,Math.PI,0);
  }
  ctx.fill();
}

function desenharColinas(fase){
  ctx.fillStyle=fase.colinasA; desenharCamadaColinas(estado.colinasA,230,145,CHAO_Y+8);
  ctx.fillStyle=fase.colinasB; desenharCamadaColinas(estado.colinasB,150,92,CHAO_Y+8);
}

function desenharDecoracao(fase){
  if(fase.decor==='pipes'){
    const d=estado.decorDesloc%320;
    ctx.save();
    ctx.fillStyle='rgba(40,58,68,0.35)';
    ctx.fillRect(0,46,LARGURA,10); ctx.fillRect(0,96,LARGURA,7);
    ctx.fillStyle='rgba(25,40,50,0.5)';
    for(let x=-320;x<LARGURA+320;x+=320){
      ctx.fillRect(x-d+90,43,22,16); ctx.fillRect(x-d+220,93,16,13);
    }
    ctx.strokeStyle='rgba(30,45,55,0.4)'; ctx.lineWidth=2;
    for(let x=-400;x<LARGURA+400;x+=400){
      const px=x-(estado.decorDesloc%400)+150;
      ctx.beginPath(); ctx.moveTo(px,0); ctx.lineTo(px,26); ctx.stroke();
      ctx.fillStyle='rgba(255,240,180,0.55)';
      ctx.beginPath(); ctx.ellipse(px,30,10,6,0,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  } else if(fase.decor==='sparks'){
    ctx.save();
    for(let i=0;i<34;i++){
      const seed=i*137.5;
      const t=seed+estado.decorDesloc*(0.6+(i%5)*0.15);
      const x=((t*1.7)%(LARGURA+80))-40;
      const y=40+Math.abs(Math.sin(i*5.1+estado.decorDesloc*0.04))*200;
      const r=1.3+(i%4)*0.7;
      const a=0.35+0.65*Math.abs(Math.sin(i*1.7+estado.decorDesloc*0.08));
      ctx.fillStyle=`rgba(255,${160+(i%3)*30},60,${a})`;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  } else if(fase.decor==='boxes'){
    const passo=240, d=((estado.decorDesloc%passo)+passo)%passo;
    ctx.save(); ctx.fillStyle='rgba(20,55,45,0.45)';
    for(let x=-passo;x<LARGURA+passo;x+=passo){
      const px=x-d;
      ctx.fillRect(px,CHAO_Y-55,46,55); ctx.fillRect(px+52,CHAO_Y-38,40,38);
      ctx.fillRect(px+26,CHAO_Y-92,36,37); ctx.fillRect(px+110,CHAO_Y-70,44,70);
    }
    ctx.restore();
  } else if(fase.decor==='spray'){
    ctx.save();
    for(let i=0;i<26;i++){
      const seed=i*211.3;
      const t=seed+estado.decorDesloc*(0.4+(i%4)*0.1);
      const x=((t*1.4)%(LARGURA+100))-50;
      const y=30+Math.abs(Math.sin(i*3.7+estado.decorDesloc*0.02))*180;
      const r=6+(i%5)*4;
      const cores=['rgba(180,120,255,0.15)','rgba(255,120,200,0.13)','rgba(120,180,255,0.14)','rgba(255,200,120,0.12)'];
      ctx.fillStyle=cores[i%cores.length];
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  } else if(fase.decor==='serragem'){
    ctx.save();
    for(let i=0;i<40;i++){
      const seed=i*173.7;
      const t=seed+estado.decorDesloc*(0.7+(i%4)*0.15);
      const x=((t*1.9)%(LARGURA+60))-30;
      const y=60+Math.abs(Math.sin(i*4.2+estado.decorDesloc*0.03))*220;
      const r=1+(i%3)*0.6;
      ctx.fillStyle=`rgba(230,200,140,${0.4+(i%4)*0.12})`;
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  } else if(fase.decor==='circuit'){
    const passo=200, d=((estado.decorDesloc%passo)+passo)%passo;
    ctx.save(); ctx.strokeStyle='rgba(120,220,255,0.28)'; ctx.lineWidth=1.5;
    for(let x=-passo;x<LARGURA+passo;x+=passo){
      const px=x-d;
      ctx.beginPath();
      ctx.moveTo(px,70); ctx.lineTo(px+40,70); ctx.lineTo(px+40,120); ctx.lineTo(px+90,120);
      ctx.moveTo(px+130,50); ctx.lineTo(px+130,100); ctx.lineTo(px+180,100);
      ctx.stroke();
      ctx.fillStyle='rgba(120,220,255,0.5)';
      ctx.beginPath(); ctx.arc(px+40,70,3,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(px+130,100,3,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function desenharChao(fase){
  const g=ctx.createLinearGradient(0,CHAO_Y,0,ALTURA);
  g.addColorStop(0,fase.chao[0]); g.addColorStop(0.5,fase.chao[1]); g.addColorStop(1,fase.chao[2]);
  ctx.fillStyle=g; ctx.fillRect(0,CHAO_Y,LARGURA,ALTURA-CHAO_Y);
  ctx.fillStyle=fase.chaoTopo; ctx.fillRect(0,CHAO_Y,LARGURA,5);
  ctx.fillStyle='rgba(0,0,0,0.15)';
  const passo=80, d=estado.deslocChao%passo;
  for(let x=-passo;x<LARGURA+passo;x+=passo){
    ctx.fillRect(x-d,CHAO_Y+18,26,4); ctx.fillRect(x-d+42,CHAO_Y+34,16,4);
  }
}

/* ══════════ OBSTÁCULOS (mesmos desenhos, resumidos) ══════════ */
function desenharPneu(o){
  const cx=o.x+o.largura/2, cy=o.y+o.altura/2, r=Math.min(o.largura,o.altura)/2-1;
  ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#0a0a0a'; ctx.lineWidth=2;
  for(let i=0;i<12;i++){const a=(i/12)*Math.PI*2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*(r*.82),cy+Math.sin(a)*(r*.82));ctx.lineTo(cx+Math.cos(a)*(r*.98),cy+Math.sin(a)*(r*.98));ctx.stroke();}
  ctx.fillStyle='#3a3a3a'; ctx.beginPath(); ctx.arc(cx,cy,r*.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#888'; ctx.beginPath(); ctx.arc(cx,cy,r*.22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#555'; ctx.beginPath(); ctx.arc(cx,cy,r*.1,0,Math.PI*2); ctx.fill();
}
function desenharMacaco(o){
  const x=o.x,y=o.y,w=o.largura,h=o.altura;
  ctx.fillStyle='#7f1d1d'; arredondado(x,y+h*.82,w,h*.18,3); ctx.fill();
  ctx.fillStyle='#991b1b'; arredondado(x+w*.05,y+h*.72,w*.9,h*.15,2); ctx.fill();
  ctx.fillStyle='#dc2626'; arredondado(x+w*.22,y+h*.3,w*.56,h*.45,3); ctx.fill();
  ctx.fillStyle='#f87171'; arredondado(x+w*.28,y+h*.35,w*.15,h*.35,2); ctx.fill();
  ctx.fillStyle='#4b5563'; arredondado(x+w*.15,y,w*.7,h*.12,2); ctx.fill();
  ctx.fillStyle='#6b7280'; arredondado(x+w*.15,y,w*.7,h*.06,2); ctx.fill();
  ctx.strokeStyle='#374151'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+w*.5,y+h*.4); ctx.lineTo(x+w*1.05,y+h*.05); ctx.stroke();
  ctx.lineCap='butt';
}
function desenharCaixa(o){
  const x=o.x,y=o.y,w=o.largura,h=o.altura;
  ctx.strokeStyle='#1f2937'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x+w*.25,y+h*.2); ctx.quadraticCurveTo(x+w*.5,y-h*.15,x+w*.75,y+h*.2); ctx.stroke();
  ctx.lineCap='butt';
  ctx.fillStyle='#dc2626'; arredondado(x,y+h*.2,w,h*.8,4); ctx.fill();
  ctx.strokeStyle='#991b1b'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+2,y+h*.4); ctx.lineTo(x+w-2,y+h*.4); ctx.stroke();
  ctx.fillStyle='#fbbf24'; arredondado(x+w*.4,y+h*.35,w*.2,h*.12,2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)'; arredondado(x+4,y+h*.5,w*.2,h*.4,2); ctx.fill();
}
function desenharBigorna(o){
  const x=o.x,y=o.y,w=o.largura,h=o.altura;
  ctx.fillStyle='#1f2937'; arredondado(x+w*.12,y+h*.72,w*.76,h*.28,3); ctx.fill();
  ctx.fillStyle='#374151'; arredondado(x+w*.2,y+h*.62,w*.6,h*.14,2); ctx.fill();
  ctx.fillStyle='#1f2937'; arredondado(x+w*.28,y+h*.4,w*.44,h*.25,2); ctx.fill();
  ctx.fillStyle='#4b5563';
  ctx.beginPath(); ctx.moveTo(x,y+h*.4); ctx.lineTo(x+w*.85,y+h*.4); ctx.lineTo(x+w*.75,y+h*.05); ctx.lineTo(x+w*.1,y+h*.05); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#6b7280';
  ctx.beginPath(); ctx.moveTo(x+w*.1,y+h*.05); ctx.lineTo(x+w*.75,y+h*.05); ctx.lineTo(x+w*.7,y+h*.13); ctx.lineTo(x+w*.12,y+h*.13); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#4b5563';
  ctx.beginPath(); ctx.moveTo(x-5,y+h*.28); ctx.lineTo(x+w*.1,y+h*.05); ctx.lineTo(x+w*.1,y+h*.4); ctx.closePath(); ctx.fill();
}
function desenharEngrenagem(o,rot){
  rot=rot||0;
  const cx=o.x+o.largura/2, cy=o.y+o.altura/2, r=Math.min(o.largura,o.altura)/2-1;
  const dentes=9, rI=r*.72;
  ctx.save(); ctx.translate(cx,cy); ctx.rotate(rot);
  ctx.fillStyle='#6b7280'; ctx.beginPath();
  for(let i=0;i<dentes*2;i++){
    const a=(i/(dentes*2))*Math.PI*2-Math.PI/2;
    const rr=i%2===0?r:rI;
    const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#374151'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#4b5563'; ctx.beginPath(); ctx.arc(0,0,r*.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1f2937'; ctx.beginPath(); ctx.arc(0,0,r*.22,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.15)'; ctx.beginPath(); ctx.arc(-r*.15,-r*.15,r*.3,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function desenharBarra(o){
  const x=o.x,y=o.y,w=o.largura,h=o.altura, n=4, bh=h/n;
  for(let i=0;i<n;i++){
    const yy=y+i*bh;
    const g=ctx.createLinearGradient(x,0,x+w,0);
    g.addColorStop(0,'#6b4a2a'); g.addColorStop(.5,'#a0764a'); g.addColorStop(1,'#6b4a2a');
    ctx.fillStyle=g; arredondado(x,yy+1,w,bh-2,3); ctx.fill();
    ctx.fillStyle='rgba(255,220,180,0.25)'; ctx.fillRect(x+2,yy+3,w-4,2);
  }
}
function desenharEngradado(o){
  const x=o.x,y=o.y,w=o.largura,h=o.altura;
  ctx.fillStyle='#a0522d'; arredondado(x,y,w,h,3); ctx.fill();
  ctx.strokeStyle='#6b3410'; ctx.lineWidth=3; arredondado(x+1.5,y+1.5,w-3,h-3,2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+4,y+4); ctx.lineTo(x+w-4,y+h-4); ctx.stroke();

/* ══════════ MOEDAS ══════════ */
function desenharMoeda(m){
  const cx=m.x+m.largura/2, cy=m.y+m.altura/2+Math.sin(m.bob)*4;
  const escalaX=Math.abs(Math.cos(m.rot))*0.85+0.15;
  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(escalaX,1);
  /* brilho */
  const g=ctx.createRadialGradient(0,0,2,0,0,22);
  g.addColorStop(0,'rgba(255,220,80,0.5)');
  g.addColorStop(1,'rgba(255,220,80,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,22,0,Math.PI*2); ctx.fill();
  /* moeda */
  ctx.fillStyle='#fbbf24'; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#b45309'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='#fde68a'; ctx.beginPath(); ctx.arc(0,0,5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#92400e'; ctx.font='bold 10px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('$',0,0.5);
  ctx.restore();
}

/* ══════════ POWER-UPS ══════════ */
function desenharPowerUp(p){
  const cx=p.x+p.largura/2, cy=p.y+p.altura/2+Math.sin(p.bob)*4;
  const cores={
    escudo:['100,180,255','#2563eb','#dbeafe'],
    ima:['200,100,255','#a855f7','#f3e8ff'],
    lento:['100,255,200','#10b981','#d1fae5'],
    inv:['255,200,80','#f59e0b','#fef3c7'],
    super:['255,100,150','#ec4899','#fce7f3']
  }[p.tipo];
  const gGlow=ctx.createRadialGradient(cx,cy,4,cx,cy,34);
  gGlow.addColorStop(0,`rgba(${cores[0]},0.55)`);
  gGlow.addColorStop(1,`rgba(${cores[0]},0)`);
  ctx.fillStyle=gGlow; ctx.beginPath(); ctx.arc(cx,cy,34,0,Math.PI*2); ctx.fill();

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(Math.sin(p.bob*.5)*.12);
  /* fundo hexagonal */
  ctx.fillStyle=cores[1];
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=(i/6)*Math.PI*2-Math.PI/2;
    const px=Math.cos(a)*16, py=Math.sin(a)*16;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle=cores[2]; ctx.lineWidth=2.5; ctx.stroke();

  /* símbolo interno */
  ctx.fillStyle='#fff';
  if(p.tipo==='escudo'){
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=(i/10)*Math.PI*2-Math.PI/2;
      const rr=i%2===0?9:3.5;
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  } else if(p.tipo==='ima'){
    ctx.lineWidth=5; ctx.lineCap='round';
    ctx.strokeStyle='#fff';
    ctx.beginPath(); ctx.arc(0,0,9,Math.PI*.15,Math.PI*.85,true); ctx.stroke();
    ctx.lineCap='butt';
  } else if(p.tipo==='lento'){
    ctx.beginPath(); ctx.arc(0,0,10,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle='#fff'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-7); ctx.moveTo(0,0); ctx.lineTo(5,3); ctx.stroke();
  } else if(p.tipo==='inv'){
    ctx.beginPath(); ctx.ellipse(0,0,11,7,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=cores[1];
    ctx.beginPath(); ctx.arc(0,0,3.5,0,Math.PI*2); ctx.fill();
  } else if(p.tipo==='super'){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=(i/5)*Math.PI*2-Math.PI/2;
      const px=Math.cos(a)*10, py=Math.sin(a)*10;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ══════════ BOSS (Robô Gigante) ══════════ */
function desenharBoss(){
  if(!boss.ativo&&boss.entrada<=0) return;
  const prog=Math.min(1,boss.entrada);
  const ease=1-Math.pow(1-prog,3);
  const offX=(1-ease)*260;
  const bw=190, bh=210;
  const bx=LARGURA-bw-20+offX, by=CHAO_Y-bh;
  const flash=boss.hitFlash>0&&Math.sin(estado.frame*.9)>0;

  ctx.save(); ctx.globalAlpha=.3*ease; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(bx+bw/2,CHAO_Y+3,bw*.55,10,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.fillStyle=flash?'#a03030':'#2a2a3a';
  arredondado(bx+bw*.15,by+bh*.78,bw*.28,bh*.22,6); ctx.fill();
  arredondado(bx+bw*.57,by+bh*.78,bw*.28,bh*.22,6); ctx.fill();
  ctx.fillStyle=flash?'#c04040':'#1a1a26';
  arredondado(bx+bw*.08,by+bh*.94,bw*.42,bh*.06,4); ctx.fill();
  arredondado(bx+bw*.5,by+bh*.94,bw*.42,bh*.06,4); ctx.fill();

  const g=ctx.createLinearGradient(bx,by,bx+bw,by+bh);
  g.addColorStop(0,flash?'#d04040':'#4a4a5e');
  g.addColorStop(.5,flash?'#b03030':'#3a3a4a');
  g.addColorStop(1,flash?'#802020':'#252535');
  ctx.fillStyle=g;
  arredondado(bx+bw*.1,by+bh*.35,bw*.8,bh*.45,10); ctx.fill();
  ctx.strokeStyle='#1a1a26'; ctx.lineWidth=3;
  arredondado(bx+bw*.1,by+bh*.35,bw*.8,bh*.45,10); ctx.stroke();

  ctx.fillStyle=flash?'#ff6060':'#ff3333';
  ctx.beginPath(); ctx.arc(bx+bw*.5,by+bh*.55,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=flash?'#ffaaaa':'#ff8080';
  ctx.beginPath(); ctx.arc(bx+bw*.5,by+bh*.55,5,0,Math.PI*2); ctx.fill();

  ctx.fillStyle=flash?'#a03030':'#2a2a3a';
  arredondado(bx+bw*.2,by+bh*.05,bw*.6,bh*.28,8); ctx.fill();
  ctx.strokeStyle='#1a1a26'; ctx.lineWidth=3;
  arredondado(bx+bw*.2,by+bh*.05,bw*.6,bh*.28,8); ctx.stroke();

  const pulsar=.7+.3*Math.sin(estado.frame*.15);
  ctx.save();
  ctx.shadowColor='#ff2020'; ctx.shadowBlur=14;
  ctx.fillStyle=`rgba(255,50,50,${pulsar})`;
  ctx.beginPath();
  ctx.arc(bx+bw*.36,by+bh*.18,7,0,Math.PI*2);
  ctx.arc(bx+bw*.64,by+bh*.18,7,0,Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle=flash?'#a03030':'#3a3a4a';
  arredondado(bx+bw*.85,by+bh*.32,bw*.22,bh*.14,6); ctx.fill();
  ctx.fillStyle=flash?'#c04040':'#4a4a5e';
  ctx.beginPath(); ctx.arc(bx+bw*1.06,by+bh*.38,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=flash?'#a03030':'#3a3a4a';
  arredondado(bx-bw*.06,by+bh*.4,bw*.2,bh*.42,6); ctx.fill();

  ctx.strokeStyle='#6a6a7a'; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(bx+bw*.5,by+bh*.05); ctx.lineTo(bx+bw*.5,by-14);
  ctx.stroke();
  ctx.fillStyle=`rgba(255,50,50,${pulsar})`;
  ctx.beginPath(); ctx.arc(bx+bw*.5,by-18,6,0,Math.PI*2); ctx.fill();
}

/* ══════════ JOGADOR ══════════ */
function desenharJogador(){
  const skin=SKINS[skinAtual];
  const px=jogador.x, py=jogador.y;
  const w=jogador.largura, h=jogador.alturaAtual;
  const topo=py-h;

  /* rastro */
  for(let i=0;i<jogador.rastro.length;i++){
    const r=jogador.rastro[i];
    const a=r.vida/0.4;
    ctx.save(); ctx.globalAlpha=a*0.35;
    ctx.fillStyle=skin.corpo[0];
    ctx.beginPath();
    ctx.ellipse(r.x,r.y,10*a+3,16*a+4,0,0,Math.PI*2);
    ctx.fill(); ctx.restore();
  }

  /* aura escudo */
  if(estado.powerUps.escudo>0||jogador.dashTempo>0){
    const pulso=.75+.25*Math.sin(estado.frame*.3);
    const a=(estado.powerUps.escudo>0&&estado.powerUps.escudo<1.2)
      ?(.5+.5*Math.sin(estado.frame*.8)):.85;
    ctx.save(); ctx.globalAlpha=a;
    const gA=ctx.createRadialGradient(px+w/2,py-h/2,10,px+w/2,py-h/2,55);
    gA.addColorStop(0,'rgba(100,180,255,0)');
    gA.addColorStop(.7,`rgba(100,180,255,${0.28*pulso})`);
    gA.addColorStop(1,'rgba(150,220,255,0.7)');
    ctx.fillStyle=gA;
    ctx.beginPath(); ctx.arc(px+w/2,py-h/2,55,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=`rgba(200,235,255,${.75*pulso})`; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(px+w/2,py-h/2,42+Math.sin(estado.frame*.2)*2,0,Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  /* aura ímã */
  if(estado.powerUps.ima>0){
    ctx.save();
    for(let i=0;i<6;i++){
      const a=estado.frame*.08+(i/6)*Math.PI*2;
      const r=32+Math.sin(estado.frame*.15+i)*4;
      const sx=px+w/2+Math.cos(a)*r, sy=py-h/2+Math.sin(a)*r;
      ctx.fillStyle=`rgba(255,220,80,${.5+.5*Math.sin(estado.frame*.2+i)})`;
      ctx.beginPath(); ctx.arc(sx,sy,2.5,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
  /* aura câmera lenta */
  if(estado.powerUps.lento>0){
    ctx.save();
    ctx.strokeStyle=`rgba(100,255,200,${.4+.4*Math.sin(estado.frame*.15)})`;
    ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      const r=30+i*10+((estado.frame*.6)%12);
      ctx.globalAlpha=Math.max(0,1-r/60);
      ctx.beginPath(); ctx.arc(px+w/2,py-h/2,r,0,Math.PI*2); ctx.stroke();
    }
    ctx.restore();
  }
  /* aura super pulo */
  if(estado.powerUps.super>0){
    ctx.save();
    ctx.fillStyle=`rgba(255,100,150,${.3+.3*Math.sin(estado.frame*.25)})`;
    for(let i=0;i<5;i++){
      const a=estado.frame*.06+i*Math.PI*2/5;
      const r=28;
      const sx=px+w/2+Math.cos(a)*r, sy=py-h/2+Math.sin(a)*r;
      ctx.beginPath();
      for(let k=0;k<5;k++){
        const aa=(k/5)*Math.PI*2-Math.PI/2;
        const rr=k%2===0?5:2;
        const ppx=sx+Math.cos(aa)*rr, ppy=sy+Math.sin(aa)*rr;
        if(k===0) ctx.moveTo(ppx,ppy); else ctx.lineTo(ppx,ppy);
      }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  /* piscar quando invulnerável */
  const piscando=(jogador.invuln>0)&&(Math.floor(estado.frame*.15)%2===0);
  ctx.save();
  if(piscando) ctx.globalAlpha=0.4;

  /* sombra */
  const altAr=Math.max(0,CHAO_Y-py);
  const f=Math.max(.25,1-altAr/170);
  ctx.save();
  ctx.globalAlpha=ctx.globalAlpha*0.22*f;
  ctx.fillStyle='#0a2a12';
  ctx.beginPath(); ctx.ellipse(px+w/2,CHAO_Y+3,(w/2+7)*f,7*f,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  /* pernas */
  ctx.fillStyle=skin.pernas;
  const correndo=jogador.noChao&&estado.tela!=='fim';
  if(correndo){
    const s=Math.sin(estado.frame*.32)*5;
    arredondado(px+7+s,py-11,10,11,4); ctx.fill();
    arredondado(px+21-s,py-11,10,11,4); ctx.fill();
  } else if(jogador.agachando){
    arredondado(px+4,py-6,12,7,3); ctx.fill();
    arredondado(px+22,py-6,12,7,3); ctx.fill();
  } else {
    arredondado(px+8,py-9,10,9,4); ctx.fill();
    arredondado(px+20,py-9,10,9,4); ctx.fill();
  }

  /* corpo */
  const g=ctx.createLinearGradient(px,topo,px+w,topo+40);
  g.addColorStop(0,skin.corpo[0]); g.addColorStop(1,skin.corpo[1]);
  ctx.fillStyle=g;
  arredondado(px,topo,w,h-6,13); ctx.fill();
  ctx.strokeStyle='rgba(130,25,45,0.35)'; ctx.lineWidth=2;
  arredondado(px,topo,w,h-6,13); ctx.stroke();

  /* olhos (diminuem quando agachado) */
  const olhoY=topo+(jogador.agachando?10:16);
  const olhoTamX=jogador.agachando?4.5:5.5;
  const olhoTamY=jogador.agachando?5:6.5;
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(px+13,olhoY,olhoTamX,olhoTamY,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(px+26,olhoY,olhoTamX,olhoTamY,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=skin.olho;
  ctx.beginPath(); ctx.arc(px+14.5,olhoY+1,2.7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(px+27.5,olhoY+1,2.7,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ══════════ HUD ══════════ */
function desenharHUD(){
  ctx.save();
  ctx.textBaseline='top';

  /* pontuação */
  ctx.textAlign='right';
  ctx.font='bold 28px ui-monospace, Menlo, Consolas, monospace';
  ctx.shadowColor='rgba(0,0,0,.55)'; ctx.shadowBlur=4;
  ctx.fillStyle='#fff';
  ctx.fillText(String(estado.pontos).padStart(5,'0'),LARGURA-28,22);

  /* multiplicador (combo × imã) */
  const mult=(estado.powerUps.ima>0?2:1)*(1+estado.combo*0.5);
  if(mult>1){
    ctx.font='bold 18px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle='#fde047';
    ctx.fillText('×'+mult.toFixed(1).replace('.0',''),LARGURA-130,28);
  }

  /* combo */
  if(estado.combo>0){
    ctx.textAlign='center';
    ctx.font='bold 16px system-ui, sans-serif';
    ctx.fillStyle='#ffcc00';
    ctx.fillText('COMBO ×'+estado.combo,LARGURA/2,90);
  }

  /* recorde + moedas */
  ctx.textAlign='left';
  ctx.font='bold 14px system-ui, sans-serif';
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.fillText('RECORDE  '+String(recorde).padStart(5,'0'),28,30);
  ctx.fillStyle='#fbbf24';
  ctx.fillText('🪙 '+moedasTotais+' (esta: '+estado.moedasRun+')',28,50);

  /* corações */
  for(let i=0;i<VIDA_MAX;i++){
    const hx=28+i*30, hy=78;
    ctx.fillStyle=i<jogador.vidas?'#ef4444':'rgba(255,255,255,0.2)';
    ctx.beginPath();
    ctx.moveTo(hx+11,hy+18);
    ctx.bezierCurveTo(hx-2,hy+8,hx+2,hy-2,hx+11,hy+6);
    ctx.bezierCurveTo(hx+20,hy-2,hx+24,hy+8,hx+11,hy+18);
    ctx.closePath(); ctx.fill();
    if(i<jogador.vidas){
      ctx.fillStyle='rgba(255,200,200,0.4)';
      ctx.beginPath(); ctx.arc(hx+7,hy+6,3,0,Math.PI*2); ctx.fill();
    }
  }

  /* fase/boss */
  ctx.textAlign='center';
  ctx.font='bold 14px system-ui, sans-serif';
  if(isBossPhase()){
    ctx.fillStyle='#ff8080';
    ctx.fillText('⚠ CHEFE  •  ROBÔ GIGANTE  ⚠',LARGURA/2,26);
  } else {
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.fillText('FASE '+(estado.faseIdx+1)+'/'+FASES.length+'  •  '+
                 FASES[estado.faseIdx].nome.toUpperCase()+
                 (estado.ciclo>0?'  • CICLO '+(estado.ciclo+1):''),LARGURA/2,26);
  }

  /* barra progresso fase */
  if(!isBossPhase()){
    const barW=200,barH=4,barX=(LARGURA-barW)/2,barY=48;
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.25)';
    arredondado(barX,barY,barW,barH,2); ctx.fill();
    const prog=Math.min(1,estado.faseTempo/FASE_DURACAO);
    ctx.fillStyle='rgba(255,210,80,.95)';
    arredondado(barX,barY,barW*prog,barH,2); ctx.fill();
  }

  /* barra HP boss */
  if(isBossPhase()&&boss.ativo){
    const barW=360,barH=16,barX=(LARGURA-barW)/2,barY=50;
    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(0,0,0,.55)';
    arredondado(barX-3,barY-3,barW+6,barH+6,5); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.12)';
    arredondado(barX,barY,barW,barH,4); ctx.fill();
    const prop=boss.hp/boss.maxHp;
    const gBar=ctx.createLinearGradient(barX,0,barX+barW,0);
    gBar.addColorStop(0,'#ef4444'); gBar.addColorStop(.5,'#f87171'); gBar.addColorStop(1,'#dc2626');
    ctx.fillStyle=gBar;
    arredondado(barX,barY,barW*Math.max(0,prop),barH,4); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.font='bold 11px system-ui, sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('CHEFE  '+boss.hp+' / '+boss.maxHp,LARGURA/2,barY+barH/2+1);
    ctx.textBaseline='top';
  }

  /* ícones power-ups ativos (canto inferior esquerdo) */
  let px=30, py=ALTURA-46;
  const dur={escudo:5,ima:8,lento:5,inv:5,super:8};
  const ordem=['escudo','ima','lento','inv','super'];
  for(const k of ordem){
    if(estado.powerUps[k]>0){
      desenharIconePU(px,py,k,estado.powerUps[k]/dur[k]);
      px+=44;
    }
  }

  /* indicador de dash */
  const dashW=64, dashH=6, dashX=30, dashY=ALTURA-22;
  ctx.fillStyle='rgba(0,0,0,0.5)'; arredondado(dashX,dashY,dashW,dashH,3); ctx.fill();
  const dashP=1-Math.max(0,jogador.dashCd/DASH_CD);
  ctx.fillStyle=dashP>=1?'#60e0ff':'rgba(100,180,255,0.7)';
  arredondado(dashX,dashY,dashW*dashP,dashH,3); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 10px system-ui, sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText('DASH (X)',dashX+dashW+8,dashY-2);

  ctx.restore();
}

function desenharIconePU(x,y,tipo,prog){
  const size=34;
  const cor={escudo:'#2563eb',ima:'#7c3aed',lento:'#10b981',inv:'#f59e0b',super:'#ec4899'}[tipo];
  ctx.save();
  ctx.fillStyle='rgba(0,0,0,0.5)';
  ctx.beginPath(); ctx.arc(x+size/2,y+size/2,size/2+2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle=cor; ctx.lineWidth=3;
  ctx.beginPath();
  ctx.arc(x+size/2,y+size/2,size/2+1,-Math.PI/2,-Math.PI/2+Math.PI*2*prog);
  ctx.stroke();
  ctx.fillStyle=cor;
  ctx.beginPath(); ctx.arc(x+size/2,y+size/2,size/2-3,0,Math.PI*2); ctx.fill();
  /* símbolos mini */
  ctx.fillStyle='#fff';
  if(tipo==='escudo'){
    ctx.beginPath();
    for(let i=0;i<10;i++){
      const a=(i/10)*Math.PI*2-Math.PI/2;
      const rr=i%2===0?8:3;
      const px=x+size/2+Math.cos(a)*rr, py=y+size/2+Math.sin(a)*rr;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  } else if(tipo==='ima'){
    ctx.strokeStyle='#fff'; ctx.lineWidth=4; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(x+size/2,y+size/2,7,Math.PI*.15,Math.PI*.85,true); ctx.stroke();
    ctx.lineCap='butt';
  } else if(tipo==='lento'){
    ctx.beginPath(); ctx.arc(x+size/2,y+size/2,8,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle=cor; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x+size/2,y+size/2); ctx.lineTo(x+size/2,y+size/2-5);
    ctx.moveTo(x+size/2,y+size/2); ctx.lineTo(x+size/2+4,y+size/2+3); ctx.stroke();
  } else if(tipo==='inv'){
    ctx.beginPath(); ctx.ellipse(x+size/2,y+size/2,9,6,0,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=cor;
    ctx.beginPath(); ctx.arc(x+size/2,y+size/2,3,0,Math.PI*2); ctx.fill();
  } else if(tipo==='super'){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const a=(i/5)*Math.PI*2-Math.PI/2;
      const px=x+size/2+Math.cos(a)*8, py=y+size/2+Math.sin(a)*8;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* ══════════ BANNER ══════════ */
function desenharBanner(){
  if(estado.tela!=='jogando') return;
  let texto,sub,prog;
  if(estado.aviso>0){
    if(isBossPhase()){texto='⚠ CHEFE ⚠';sub='Robô Gigante — desvie das engrenagens!';}
    else{texto='FASE '+(estado.faseIdx+1)+' / '+FASES.length;sub=FASES[estado.faseIdx].nome;}
    prog=1-estado.aviso/FASE_INTRO;
  } else if(estado.concluindo>0){
    if(isBossPhase()){texto='CHEFE DERROTADO!';sub='Você venceu o ciclo!';}
    else{
      texto='FASE CONCLUÍDA!';
      const estrelas='★'.repeat(estado.estrelas)+'☆'.repeat(3-estado.estrelas);
      sub=estrelas+'  (vidas restantes)';
    }
    prog=1-estado.concluindo/FASE_OUTRO;
  } else return;

  let alpha=1;
  if(prog<.15) alpha=prog/.15;
  else if(prog>.85) alpha=(1-prog)/.15;
  alpha=clamp(alpha,0,1);

  ctx.save(); ctx.globalAlpha=alpha;
  const pw=620, ph=140;
  const px=(LARGURA-pw)/2, py=ALTURA/2-ph/2;
  const corB=isBossPhase()?'rgba(255,100,100,0.85)':'rgba(255,220,120,0.7)';
  const corT=isBossPhase()?'#ff8080':'#ffe066';

  ctx.fillStyle='rgba(12,28,40,0.85)';
  arredondado(px,py,pw,ph,16); ctx.fill();
  ctx.strokeStyle=corB; ctx.lineWidth=3;
  arredondado(px+1.5,py+1.5,pw-3,ph-3,16); ctx.stroke();

  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle=corT; ctx.font='bold 44px system-ui, sans-serif';
  ctx.fillText(texto,LARGURA/2,py+52);
  ctx.fillStyle='rgba(255,255,255,.95)'; ctx.font='bold 20px system-ui, sans-serif';
  ctx.fillText(sub,LARGURA/2,py+100);
  ctx.restore();
}

/* ══════════ CLIMA DESENHO ══════════ */
function desenharClima(){
  ctx.save();
  for(const c of climaP){
    if(c.t==='rain'){
      ctx.strokeStyle='rgba(180,210,255,0.55)';
      ctx.lineWidth=c.tam;
      ctx.beginPath(); ctx.moveTo(c.x,c.y); ctx.lineTo(c.x-1.5,c.y+9); ctx.stroke();
    } else if(c.t==='snow'){
      ctx.fillStyle='rgba(255,250,240,0.75)';
      ctx.beginPath(); ctx.arc(c.x,c.y,c.tam,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
}

/* ══════════ NOITE OVERLAY ══════════ */
function desenharOverlayNoite(){
  if(estado.tela!=='jogando'||isBossPhase()) return;
  const prog=clamp(estado.faseTempo/FASE_DURACAO,0,1);
  if(prog<0.6) return;
  const a=(prog-0.6)/0.4*0.4;
  ctx.save();
  ctx.fillStyle=`rgba(10,15,40,${a})`;
  ctx.fillRect(0,0,LARGURA,ALTURA);
  ctx.restore();
}

function desenharMenu(){

  ctx.strokeStyle='rgba(255,100,100,0.7)'; ctx.lineWidth=1.2;
  arredondado(cxB-45,115,90,36,6); ctx.stroke();
  ctx.fillStyle='#ff8080'; ctx.font='bold 11px system-ui';
  ctx.fillText('⚠ CHEFE',cxB,128);
  ctx.font='bold 9px system-ui';
  ctx.fillStyle='rgba(255,200,200,0.85)';
  ctx.fillText('Robô Gigante',cxB,141);

  /* controles */
  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.font='bold 14px system-ui, sans-serif';
  ctx.fillText('ESPAÇO / ↑ / Clique = Pular  •  ↓ / S = Agachar  •  X = Dash',LARGURA/2,195);

  /* power-ups */
  ctx.fillStyle='rgba(150,220,255,0.9)';
  ctx.font='bold 12px system-ui, sans-serif';
  ctx.fillText('🛡️ Escudo  🧲 Ímã  ⏱️ Câmera lenta  👁️ Invisível  ⭐ Super pulo',LARGURA/2,220);

  /* skins */
  ctx.fillStyle='#fff';
  ctx.font='bold 13px system-ui, sans-serif';
  ctx.fillText('SKINS  (clique para selecionar • desbloqueie com moedas)',LARGURA/2,255);

  const sW=100, sH=60, gap=12;
  const sTot=SKINS.length*sW+(SKINS.length-1)*gap;
  const sX0=(LARGURA-sTot)/2;
  for(let i=0;i<SKINS.length;i++){
    const sx=sX0+i*(sW+gap), sy=280;
    const un=skinsDesbloq.includes(i);
    const sel=skinAtual===i;
    ctx.fillStyle=un?'rgba(40,60,80,0.9)':'rgba(20,25,35,0.85)';
    arredondado(sx,sy,sW,sH,8); ctx.fill();
    ctx.strokeStyle=sel?'#ffe066':un?'rgba(150,180,210,0.5)':'rgba(60,60,70,0.5)';
    ctx.lineWidth=sel?3:1.5;
    arredondado(sx,sy,sW,sH,8); ctx.stroke();

    /* miniatura */
    ctx.fillStyle=SKINS[i].corpo[0];
    ctx.beginPath(); ctx.arc(sx+22,sy+sH/2,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=SKINS[i].corpo[1];
    ctx.beginPath(); ctx.arc(sx+22,sy+sH/2,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=SKINS[i].corpo[0];
    ctx.beginPath(); ctx.arc(sx+22,sy+sH/2,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(sx+19,sy+sH/2-2,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+25,sy+sH/2-2,2,0,Math.PI*2); ctx.fill();

    ctx.fillStyle=un?'#fff':'rgba(180,180,180,0.7)';
    ctx.font='bold 11px system-ui, sans-serif';
    ctx.textAlign='left';
    ctx.fillText(SKINS[i].nome,sx+40,sy+22);
    if(un){
      ctx.fillStyle='rgba(150,220,150,0.9)';
      ctx.font='bold 10px system-ui';
      ctx.fillText(sel?'✓ ATIVO':'',sx+40,sy+40);
    } else {
      ctx.fillStyle=SKINS[i].preco<=moedasTotais?'#fbbf24':'rgba(255,150,100,0.8)';
      ctx.font='bold 10px system-ui';
      ctx.fillText('🪙 '+SKINS[i].preco,sx+40,sy+40);
    }
    ctx.textAlign='center';
  }

  /* começe */
  const a=.5+.5*Math.sin(estado.frame*.08);
  ctx.globalAlpha=a;
  ctx.fillStyle='#ffe066';
  ctx.font='bold 22px system-ui, sans-serif';
  ctx.fillText('PRESSIONE ESPAÇO PARA COMEÇAR',LARGURA/2,375);
  ctx.globalAlpha=1;

  /* total moedas */
  ctx.fillStyle='#fbbf24';
  ctx.font='bold 14px system-ui, sans-serif';
  ctx.textAlign='right';
  ctx.fillText('🪙 '+moedasTotais+' moedas',LARGURA-20,ALTURA-15);
  ctx.textAlign='left';
  ctx.fillStyle='rgba(255,255,255,0.7)';
  ctx.fillText('RECORDE: '+recorde,20,ALTURA-15);

  ctx.restore();
}

function desenharFim(){
  ctx.save();
  ctx.fillStyle='rgba(12,28,40,0.7)';
  ctx.fillRect(0,0,LARGURA,ALTURA);

  ctx.textAlign='center'; ctx.textBaseline='middle';

  ctx.fillStyle='#ff8a8a';
  ctx.font='bold 54px system-ui, sans-serif';
  ctx.fillText('FIM DE JOGO',LARGURA/2,ALTURA/2-90);

  ctx.fillStyle='#fff';
  ctx.font='bold 34px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillText('PONTOS: '+estado.pontos,LARGURA/2,ALTURA/2-30);

  ctx.fillStyle='#fbbf24';
  ctx.font='bold 18px system-ui, sans-serif';
  ctx.fillText('🪙 Moedas coletadas: '+estado.moedasRun,LARGURA/2,ALTURA/2+5);

  ctx.fillStyle='rgba(255,255,255,0.9)';
  ctx.font='bold 18px system-ui, sans-serif';
  const txt=isBossPhase()?'Chegou ao CHEFE':('Fase '+(estado.faseIdx+1)+' — '+FASES[estado.faseIdx].nome);
  ctx.fillText(txt+(estado.ciclo>0?'  (Ciclo '+(estado.ciclo+1)+')':''),LARGURA/2,ALTURA/2+40);

  ctx.fillStyle='rgba(255,255,255,0.75)';
  ctx.font='bold 16px system-ui, sans-serif';
  ctx.fillText('RECORDE: '+recorde,LARGURA/2,ALTURA/2+70);

  if(estado.tempoFim>30){
    const a=.5+.5*Math.sin(estado.frame*.1);
    ctx.globalAlpha=a;
    ctx.fillStyle='#ffe066';
    ctx.font='bold 20px system-ui, sans-serif';
    ctx.fillText('ESPAÇO / CLIQUE para jogar de novo',LARGURA/2,ALTURA/2+115);
    ctx.globalAlpha=1;
  }
  ctx.restore();
}

/* ══════════ DESENHO PRINCIPAL ══════════ */
function desenhar(){
  const fase=faseAtual();

  /* screen shake */
  ctx.save();
  if(estado.shake>0){
    const s=estado.shake;
    ctx.translate(rand(-s,s),rand(-s,s));
  }

  desenharCeu(fase);
  for(const n of nuvens) desenharNuvem(n,fase);
  desenharColinas(fase);
  desenharDecoracao(fase);
  desenharChao(fase);

  if(isBossPhase()) desenharBoss();

  for(const o of obstaculos) desenharObstaculo(o);
  for(const d of drones)    desenharDrone(d);
  for(const m of moedas)    desenharMoeda(m);
  for(const p of powerUps)  desenharPowerUp(p);

  desenharJogador();

  /* partículas */
  for(const p of particulas){
    ctx.globalAlpha=p.vida/p.vidaMax;
    ctx.fillStyle=p.cor;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.tam*(p.vida/p.vidaMax),0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  desenharClima();
  desenharOverlayNoite();

  ctx.restore();

  desenharHUD();
  desenharBanner();

  if(estado.tela==='menu') desenharMenu();
  else if(estado.tela==='fim') desenharFim();
}

/* ══════════ LOOP ══════════ */
let ultimoTempo=performance.now();
function loop(agora){
  let dt=(agora-ultimoTempo)/(1000/60);
  ultimoTempo=agora;
  if(!isFinite(dt)||dt<0) dt=1;
  dt=Math.min(dt,3);
  atualizar(dt);
  desenhar();
  requestAnimationFrame(loop);
}

/* ══════════ CONTROLES ══════════ */
window.addEventListener('keydown',(e)=>{
  if(['Space','ArrowUp','KeyW','ArrowDown','KeyS','KeyX','ShiftLeft','ShiftRight'].includes(e.code)){
    e.preventDefault();
  }
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){
    if(!e.repeat) pular();
  }
  if(e.code==='ArrowDown'||e.code==='KeyS') agachar(true);
  if((e.code==='KeyX'||e.code==='ShiftLeft'||e.code==='ShiftRight')&&!e.repeat){
    dash();
  }
  /* skins com números 1-5 no menu */
  if(estado.tela==='menu'&&/^Digit[1-5]$/.test(e.code)){
    const n=parseInt(e.code.slice(-1))-1;
    if(n<SKINS.length){
      if(skinsDesbloq.includes(n)){ skinAtual=n; salvar(); }
      else if(SKINS[n].preco<=moedasTotais){
        moedasTotais-=SKINS[n].preco;
        skinsDesbloq.push(n);
        skinAtual=n;
        salvar();
        SFX.power();
      }
    }
  }
},{passive:false});

window.addEventListener('keyup',(e)=>{
  if(e.code==='ArrowDown'||e.code==='KeyS') agachar(false);
});

canvas.addEventListener('pointerdown',(e)=>{
  e.preventDefault();
  initAudio();
  /* verifica clique em skin */
  if(estado.tela==='menu'){
    const rect=canvas.getBoundingClientRect();
    const x=(e.clientX-rect.left)/rect.width*LARGURA;
    const y=(e.clientY-rect.top)/rect.height*ALTURA;
    if(y>=280&&y<=340){
      const sW=100, sH=60, gap=12;
      const sTot=SKINS.length*sW+(SKINS.length-1)*gap;
      const sX0=(LARGURA-sTot)/2;
      for(let i=0;i<SKINS.length;i++){
        const sx=sX0+i*(sW+gap);
        if(x>=sx&&x<=sx+sW){
          if(skinsDesbloq.includes(i)){ skinAtual=i; salvar(); }
          else if(SKINS[i].preco<=moedasTotais){
            moedasTotais-=SKINS[i].preco;
            skinsDesbloq.push(i);
            skinAtual=i;
            salvar();
            SFX.power();
          }
          return;
        }
      }
    }
  }
  pular();
});

canvas.addEventListener('contextmenu',(e)=>e.preventDefault());

/* touch para dash com dois dedos */
let toquesAtivos=0;
canvas.addEventListener('touchstart',(e)=>{
  toquesAtivos=e.touches.length;
  if(e.touches.length>=2){
    e.preventDefault();
    dash();
  }
},{passive:false});
canvas.addEventListener('touchend',()=>{toquesAtivos=0;});

requestAnimationFrame(loop);

})();
</script>
